version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    revive:
      rules:
        - name: comment-spacings
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      # Repeated map keys are clearer inline in unstructured manifest builders.
      - linters:
          - goconst
        path: internal/pipeline/builder.go
      # Test fixtures intentionally repeat domain values and group scenarios.
      - linters:
          - goconst
          - gocyclo
        path: _test\.go
      # Kubebuilder scaffold helpers retain compatibility-oriented constructs.
      - linters:
          - staticcheck
        path: test/utils/
      # mirrord is the product name, not a misspelling of "mirrored".
      - linters:
          - misspell
        text: "`mirrord`"
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
