# Kind/cluster-ci operator install (no Helm). Applied by scripts/install-operator-kind.sh.
# Helm equivalent: helm/tekton-dag/templates/operator.yaml with operator.enabled=true.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-dag-operator
  namespace: tekton-pipelines
  labels:
    app: tekton-dag-operator
    app.kubernetes.io/part-of: tekton-job-standardization
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tekton-dag-operator-tekton-pipelines
  labels:
    app: tekton-dag-operator
    app.kubernetes.io/part-of: tekton-job-standardization
rules:
  - apiGroups: ["tektondag.io"]
    resources: ["stacks", "stackruns"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["tektondag.io"]
    resources: ["stacks/status", "stackruns/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["tektondag.io"]
    resources: ["stacks/finalizers", "stackruns/finalizers"]
    verbs: ["update"]
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns", "taskruns"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-dag-operator-tekton-pipelines
  labels:
    app: tekton-dag-operator
    app.kubernetes.io/part-of: tekton-job-standardization
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-dag-operator-tekton-pipelines
subjects:
  - kind: ServiceAccount
    name: tekton-dag-operator
    namespace: tekton-pipelines
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tekton-dag-operator
  namespace: tekton-pipelines
  labels:
    app: tekton-dag-operator
    app.kubernetes.io/part-of: tekton-job-standardization
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tekton-dag-operator
  template:
    metadata:
      labels:
        app: tekton-dag-operator
        tekton-dag/team: default
    spec:
      serviceAccountName: tekton-dag-operator
      containers:
        - name: manager
          image: localhost:5000/tekton-dag-operator:latest
          # Nested Kind often cannot kind-load overlayfs; Always pulls from the local registry.
          imagePullPolicy: Always
          args:
            - --leader-elect=false
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=0
            - --metrics-secure=false
          ports:
            - containerPort: 8081
              name: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
