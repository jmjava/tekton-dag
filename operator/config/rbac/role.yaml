---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
- apiGroups:
  - tekton.dev
  resources:
  - pipelineruns
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - tekton.dev
  resources:
  - taskruns
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - tektondag.io
  resources:
  - stackruns
  - stacks
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - tektondag.io
  resources:
  - stackruns/finalizers
  - stacks/finalizers
  verbs:
  - update
- apiGroups:
  - tektondag.io
  resources:
  - stackruns/status
  - stacks/status
  verbs:
  - get
  - patch
  - update
