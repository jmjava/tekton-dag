# This rule is not used by the project tekton-dag-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the tektondag.tektondag.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: tekton-dag-operator
    app.kubernetes.io/managed-by: kustomize
  name: stackrun-editor-role
rules:
- apiGroups:
  - tektondag.tektondag.io
  resources:
  - stackruns
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - tektondag.tektondag.io
  resources:
  - stackruns/status
  verbs:
  - get
