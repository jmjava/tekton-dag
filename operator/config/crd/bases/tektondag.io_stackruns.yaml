              observedGeneration:
                description: ObservedGeneration is the last reconciled metadata.generation.
                format: int64
                type: integer
              phase:
                description: Phase mirrors Tekton condition reason when known.
                type: string
              pipelineRunName:
                description: PipelineRunName is the owned Tekton PipelineRun (orphan
                  on delete).
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
