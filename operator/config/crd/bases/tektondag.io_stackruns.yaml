---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.1
  name: stackruns.tektondag.io
spec:
  group: tektondag.io
  names:
    kind: StackRun
    listKind: StackRunList
    plural: stackruns
    singular: stackrun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.pipelineRunName
      name: PipelineRun
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: StackRun is the Schema for the stackruns API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: StackRunSpec defines one desired pipeline execution.
            properties:
              appRevisions:
                description: AppRevisions is a JSON object string of app→sha (PR mode).
                type: string
              approvedBy:
                type: string
              cacheRepo:
                type: string
              changedApp:
                description: ChangedApp is required for pr/merge/promote.
                type: string
              continueFrom:
                description: PipelineRun or StackRun name whose resolve/build results
                  feed stack-pr-continue.
                type: string
              credentialsSecret:
                type: string
              dashboardUrl:
                description: DashboardURL and PRRepoURL optional PR comment links.
                type: string
              gitRevision:
                type: string
              gitUrl:
                description: GitURL / GitRevision for platform clone.
                type: string
              imageRegistry:
                description: ImageRegistry and CacheRepo for builds.
                type: string
              interceptBackend:
                description: InterceptBackend for PR runs (telepresence|mirrord).
                type: string
              maxRetries:
                format: int32
                type: integer
              mode:
                description: Mode selects which Tekton pipeline to create.
                enum:
                - pr
                - bootstrap
                - merge
                - promote
                type: string
              pipelineNamespace:
                description: 'PipelineNamespace overrides where PipelineRuns are created
                  (default: StackRun namespace).'
                type: string
              prNumber:
                description: PRNumber is required for mode=pr.
                format: int32
                type: integer
              prRepoUrl:
                type: string
              releaseVersion:
                description: Promote fields.
                type: string
              requireApproval:
                type: boolean
              serviceAccountName:
                description: ServiceAccountName for TaskRuns (default tekton-pr-sa).
                type: string
              stackFile:
                description: StackFile is the stack YAML path param (e.g. stacks/stack-one.yaml).
