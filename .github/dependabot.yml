version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /operator
    schedule:
      interval: weekly
    groups:
      operator-go:
        patterns: ["*"]
        update-types:
          - patch
    ignore:
      - dependency-name: "k8s.io/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "sigs.k8s.io/controller-runtime"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: npm
    directory: /management-gui/frontend
    schedule:
      interval: weekly
    groups:
      management-frontend:
        patterns: ["*"]
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /libs/baggage-node
    schedule:
      interval: weekly
    groups:
      baggage-node:
        patterns: ["*"]
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /orchestrator
    schedule:
      interval: weekly
    groups:
      orchestrator-python:
        patterns: ["*"]
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /management-gui/backend
    schedule:
      interval: weekly
    groups:
      management-backend-python:
        patterns: ["*"]
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /libs/tekton-dag-common
    schedule:
      interval: weekly
    groups:
      common-python:
        patterns: ["*"]
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /libs/baggage-python
    schedule:
      interval: weekly
    groups:
      baggage-python:
        patterns: ["*"]
        update-types:
          - minor
          - patch

  - package-ecosystem: maven
    directory: /libs/baggage-spring-boot-starter
    schedule:
      interval: weekly
    groups:
      baggage-spring:
        patterns: ["*"]
        update-types:
          - minor
          - patch

  - package-ecosystem: maven
    directory: /libs/baggage-servlet-filter
    schedule:
      interval: weekly
    groups:
      baggage-servlet:
        patterns: ["*"]
        update-types:
          - minor
          - patch

  - package-ecosystem: composer
    directory: /libs/baggage-php
    schedule:
      interval: weekly
    groups:
      baggage-php:
        patterns: ["*"]
        update-types:
          - minor
          - patch
