        update-types: ["version-update:semver-major"]

  - package-ecosystem: maven
    directory: /libs/baggage-servlet-filter
    schedule:
      interval: weekly
    rebase-strategy: disabled
    groups:
      baggage-servlet:
        patterns: ["*"]
