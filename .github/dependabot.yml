version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps(actions)
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /operator
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      kubernetes-stack-minor-patch:
        patterns:
          - k8s.io/*
          - sigs.k8s.io/controller-runtime
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps(go)

  - package-ecosystem: npm
    directories:
      - /management-gui/frontend
      - /reporting-gui/frontend
      - /reporting-gui/backend
      - /libs/baggage-node
      - /docs/demos/slides
    schedule:
      interval: weekly
      day: wednesday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps(npm)

  - package-ecosystem: pip
    directories:
      - /
      - /orchestrator
      - /management-gui/backend
      - /libs/tekton-dag-common
      - /libs/baggage-python
      - /docs/demos
      - /documentation-generator/video-framework
    schedule:
      interval: weekly
      day: thursday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps(python)

  - package-ecosystem: maven
    directories:
      - /libs/baggage-spring-boot-starter
      - /libs/baggage-servlet-filter
    schedule:
      interval: weekly
      day: friday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      maven-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps(maven)

  - package-ecosystem: composer
    directory: /libs/baggage-php
    schedule:
      interval: weekly
      day: friday
      time: "08:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      composer-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps(composer)
