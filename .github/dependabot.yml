# Group update-types only control what is batched. Ungrouped majors (and
# gomod minors) still open individual PRs unless ignore: "*" is set.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    rebase-strategy: disabled
    groups:
      github-actions:
        patterns: ["*"]
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gomod
    directory: /operator
    schedule:
      interval: weekly
    rebase-strategy: disabled
    groups:
      operator-go:
        patterns: ["*"]
        update-types:
          - patch
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: npm
    directory: /management-gui/frontend
    schedule:
      interval: weekly
    rebase-strategy: disabled
    groups:
      management-frontend:
        patterns: ["*"]
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /libs/baggage-node
