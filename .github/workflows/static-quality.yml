name: static quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-go:
    name: Ruff and Go lint/vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum

      - name: Install Python quality tools
        run: python -m pip install --requirement requirements-quality.txt

      - name: Ruff
        run: >-
          python -m ruff check
          orchestrator
          management-gui/backend
          libs/tekton-dag-common
          libs/baggage-python
          scripts

      - name: Go lint configuration
        working-directory: operator
        run: make lint-config

      - name: Go lint and vet
        working-directory: operator
        env:
          GOTOOLCHAIN: auto
        run: |
          make lint
          make vet

  shell-structured:
    name: Shell, workflows, YAML, and JSON
    runs-on: ubuntu-latest
    env:
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install structured-file parser
        run: python -m pip install --requirement requirements-quality.txt

      - name: Install pinned shell and workflow linters
        run: |
          shellcheck_archive="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSLo "/tmp/${shellcheck_archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${shellcheck_archive}"
          echo "${SHELLCHECK_SHA256}  /tmp/${shellcheck_archive}" | sha256sum -c -
          tar -xJf "/tmp/${shellcheck_archive}" -C /tmp
          sudo install "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck

          actionlint_archive="actionlint_${ACTIONLINT_VERSION}_linux_x86_64.tar.gz"
          curl -fsSLo "/tmp/${actionlint_archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${actionlint_archive}"
          echo "${ACTIONLINT_SHA256}  /tmp/${actionlint_archive}" | sha256sum -c -
          tar -xzf "/tmp/${actionlint_archive}" -C /tmp actionlint
          sudo install /tmp/actionlint /usr/local/bin/actionlint

      - name: Shell syntax and ShellCheck
        run: bash scripts/check-shell-files.sh

      - name: Strict YAML and JSON parsing
        run: python scripts/check-structured-files.py

      - name: GitHub Actions validation
        run: |
          mapfile -t workflows < <(
            git ls-files '*.yaml' '*.yml' |
              awk '/(^|\/)\.github\/workflows\//'
          )
          ((${#workflows[@]} > 0))
          actionlint -shellcheck="shellcheck --severity=warning" "${workflows[@]}"

  frontends:
    name: Frontend lint/build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: management
            path: management-gui/frontend
          - name: reporting
            path: reporting-gui/frontend
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  helm:
    name: Helm package and render
    runs-on: ubuntu-latest
    env:
      HELM_VERSION: v4.3.0
      HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install Helm and chart tooling
        run: |
          archive="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSLo "/tmp/${archive}" "https://get.helm.sh/${archive}"
          echo "${HELM_SHA256}  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          python -m pip install --requirement requirements-quality.txt
          python -m pip install --editable libs/tekton-dag-common

      - name: Package and render chart
        run: bash scripts/check-helm-chart.sh
