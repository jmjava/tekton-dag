name: compatibility matrix

on:
  pull_request:
    paths:
      - ".github/workflows/compatibility.yml"
      - "docs/support-matrix.yaml"
      - "docs/SUPPORT-MATRIX.md"
      - "scripts/check-support-matrix.py"
      - "scripts/check-support-matrix.sh"
      - "libs/baggage-python/**"
      - "libs/baggage-node/**"
      - "libs/baggage-php/**"
      - "libs/baggage-spring-boot-starter/**"
      - "libs/baggage-servlet-filter/**"
      - "libs/tekton-dag-common/**"
  workflow_dispatch:
  schedule:
    # Weekly language-version evidence on the default branch.
    - cron: "27 8 * * 5"

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Support matrix contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install checker
        run: python -m pip install --requirement requirements-quality.txt

      - name: Check support matrix
        run: bash scripts/check-support-matrix.sh

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable 'libs/tekton-dag-common[test]' --editable 'libs/baggage-python[test]'
          python -m pytest libs/baggage-python/tests libs/tekton-dag-common/tests -q --tb=short

  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: libs/baggage-node/package-lock.json

      - name: Install and test
        working-directory: libs/baggage-node
        run: |
          npm ci
          npm test

  java:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["21"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: |
            libs/baggage-spring-boot-starter/pom.xml
            libs/baggage-servlet-filter/pom.xml

      - name: Maven tests
        run: |
          (cd libs/baggage-spring-boot-starter && mvn -B -q test)
          (cd libs/baggage-servlet-filter && mvn -B -q test)

  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: ${{ matrix.php }}
          extensions: dom
          tools: composer
          coverage: none

      - name: PHPUnit
        working-directory: libs/baggage-php
        run: |
          composer install --no-interaction --quiet
          ./vendor/bin/phpunit
