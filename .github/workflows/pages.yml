name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
      - name: Cache-bust video URLs
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 <<'PY'
          import os, pathlib, re
          sha = os.environ["GITHUB_SHA"][:12]
          path = pathlib.Path("docs/index.html")
          if not path.exists():
              exit(0)
          text = path.read_text(encoding="utf-8")
          new = re.sub(
              r'src="(demos/recordings/[^"?]+\.mp4)(?:\?[^"]*)?"',
              lambda m: f'src="{m.group(1)}?v={sha}"',
              text,
          )
          new = re.sub(
              r'poster="(demos/recordings/[^"?]+\.(?:png|jpg|jpeg|webp))(?:\?[^"]*)?"',
              lambda m: f'poster="{m.group(1)}?v={sha}"',
              new,
          )
          path.write_text(new, encoding="utf-8")
          PY
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
