name: local regression

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-only:
    name: --local-only + Java/PHP/operator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            libs/baggage-spring-boot-starter/pom.xml
            libs/baggage-servlet-filter/pom.xml

      - name: Set up PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: "8.3"
          tools: composer
          coverage: none

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.8"
          cache-dependency-path: operator/go.sum

      - name: Install Helm
        env:
          HELM_VERSION: v4.3.0
          HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
        run: |
          archive="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSLo "/tmp/${archive}" "https://get.helm.sh/${archive}"
          echo "${HELM_SHA256}  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version

      - name: Bootstrap Python venv
        run: ./scripts/bootstrap-regression-venv.sh

      - name: Regression --local-only --require-lang-tests
        run: bash scripts/run-regression-stream.sh --local-only --require-lang-tests
