# Minimal stack used only for schema / injection unit tests (not a live demo stack).
name: fixture-secrets-config
description: "M13 secrets+config schema fixture"
defaults:
  namespace: staging
  container-port: "8080"
  service-port: "80"
apps:
  - name: demo-bff
    repo: example/demo-bff
    role: middleware
    build:
      tool: maven
      build-command: "mvn -q package"
      resources:
        requests:
          memory: "3Gi"
        limits:
          memory: "6Gi"
    secrets:
      env-from:
        - demo-bff-db
        - demo-bff-api-keys
      volume-mounts:
        - secret: demo-bff-tls
          mount-path: /etc/tls
    config:
      env-from:
        - demo-bff-config
      volume-mounts:
        - configmap: demo-bff-properties
          mount-path: /etc/config
registries:
  - name: staging
    url: localhost:5001
    environment: staging
    credentials-secret: ""
