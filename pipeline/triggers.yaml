# EventListener that handles both PR and merge events.
# Delegates to the appropriate pipeline based on the GitHub event action.
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: stack-event-listener
  labels:
    app.kubernetes.io/part-of: tekton-job-standardization
    app.kubernetes.io/version: "1.0.0"
spec:
  serviceAccountName: tekton-pr-sa
  triggers:
    # --- PR opened / updated → stack-pr-test pipeline ---
    - name: pr-opened
      interceptors:
        - ref:
            name: github
          params:
            - name: eventTypes
              value: ["pull_request"]
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: secret
        - ref:
            name: cel
          params:
            - name: filter
              value: "body.action in ['opened', 'synchronize', 'reopened']"
            - name: overlays
              value:
                - key: repo-name
                  expression: "body.pull_request.head.repo.name"
      bindings:
        - ref: stack-pr-binding
      template:
        ref: stack-pr-template

    # --- PR merged (in app repo) → stack-merge-release pipeline (clone platform at main, build release) ---
    - name: pr-merged
      interceptors:
        - ref:
            name: github
          params:
            - name: eventTypes
              value: ["pull_request"]
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: secret
        - ref:
            name: cel
          params:
            - name: filter
              value: "body.action == 'closed' && body.pull_request.merged == true"
            - name: overlays
              value:
                - key: repo-name
                  expression: "body.pull_request.base.repo.name"
      bindings:
        - ref: stack-merge-platform-binding
        - ref: stack-merge-binding
      template:
        ref: stack-merge-template

---
apiVersion: v1
kind: Service
metadata:
  name: el-stack-event-listener
  labels:
    app.kubernetes.io/part-of: tekton-job-standardization
    app.kubernetes.io/version: "1.0.0"
spec:
  type: LoadBalancer
  selector:
    eventlistener: stack-event-listener
  ports:
    - port: 8080
      targetPort: 8080

---
# TriggerBindings extract data from the GitHub webhook payload.

apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: stack-pr-binding
spec:
  params:
    - name: git-url
      value: $(body.pull_request.head.repo.ssh_url)
    - name: git-revision
      value: $(body.pull_request.head.sha)
    - name: pr-number
      value: $(body.pull_request.number)
    - name: changed-app
      value: $(extensions.repo-name)

---
# Platform repo (tekton-dag) at main — merge pipeline clones this, then app repos from stack at main
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: stack-merge-platform-binding
spec:
  params:
    - name: git-url
      value: "https://github.com/jmjava/tekton-dag.git"
    - name: git-revision
      value: "main"

---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: stack-merge-binding
spec:
  params:
    - name: changed-app
      value: $(extensions.repo-name)

---
# TriggerTemplates create StackRuns. stackRef is omitted: the operator matches
# spec.changedApp to a Stack CR app name or repo short name (lookupStack).
# prNumber is unquoted so YAML parses as int32 after substitution. The
# tektondag.io/pr-number annotation is a fallback if spec is dropped.

apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: stack-pr-template
spec:
  params:
    - name: git-url
    - name: git-revision
    - name: pr-number
    - name: changed-app
  resourcetemplates:
    - apiVersion: tektondag.io/v1alpha1
      kind: StackRun
      metadata:
        generateName: stackrun-pr-
        labels:
          app.kubernetes.io/part-of: tekton-job-standardization
          tektondag.io/mode: pr
        annotations:
          tektondag.io/pr-number: $(tt.params.pr-number)
      spec:
        mode: pr
        gitUrl: https://github.com/jmjava/tekton-dag.git
        gitRevision: $(tt.params.git-revision)
        prRepoUrl: $(tt.params.git-url)
        changedApp: $(tt.params.changed-app)
        prNumber: $(tt.params.pr-number)
        imageRegistry: localhost:5000

---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: stack-merge-template
spec:
  params:
    - name: git-url
    - name: git-revision
    - name: changed-app
  resourcetemplates:
    - apiVersion: tektondag.io/v1alpha1
      kind: StackRun
      metadata:
        generateName: stackrun-merge-
        labels:
          app.kubernetes.io/part-of: tekton-job-standardization
          tektondag.io/mode: merge
      spec:
        mode: merge
        gitUrl: $(tt.params.git-url)
        gitRevision: $(tt.params.git-revision)
        changedApp: $(tt.params.changed-app)
        imageRegistry: localhost:5000
