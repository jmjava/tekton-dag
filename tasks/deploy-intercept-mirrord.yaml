apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-intercept-mirrord
  labels:
    app.kubernetes.io/part-of: tekton-job-standardization
    app.kubernetes.io/version: "1.0.0"
spec:
  description: >
    Deploys PR pods with mirrord-based intercepts (M7). For each built app:
    1) Deploys a PR pod running only the built image (no Telepresence sidecar).
    2) Deploys a mirrord-proxy pod that runs mirrord exec wrapping a socat proxy;
       traffic matching the intercept header is stolen from the original deployment
       and forwarded to the PR pod. Same interface as deploy-stack-intercepts;
       use when intercept-backend=mirrord.
  params:
    - name: stack-json
      type: string
      description: "Full stack graph JSON (used to resolve ports, namespaces, topology)"
    - name: build-apps
      type: string
      description: "Space-separated list of apps that were built (ONLY these get intercepts)"
    - name: propagation-chain
      type: string
      default: ""
      description: "Full ordered chain from entry to leaf (for logging context)"
    - name: built-images
      type: string
      description: "JSON map of app → image URI"
    - name: intercept-header-value
      type: string
      description: "Header match for mirrord (e.g. x-dev-session:pr-42)"
    - name: default-namespace
      type: string
      default: "staging"
    - name: mirrord-image
      type: string
      default: "localhost:5000/tekton-dag-build-mirrord:latest"
      description: "Image for mirrord proxy pods (mirrord CLI + socat)"
    - name: proxy-service-account
      type: string
      default: "mirrord-intercept"
      description: |
        ServiceAccount the proxy pod runs as. mirrord exec must read the target
        Deployment and create the mirrord-agent Job; the default SA cannot.
        Create it with scripts/install-mirrord-intercept-rbac.sh.
  workspaces:
    - name: shared-workspace
      description: "Workspace to write deployed-pods.json for pass-through result"
  results:
    - name: deployed-pods
      description: "JSON map of app → pod name (PR pods)"
  steps:
    - name: deploy
      image: bitnami/kubectl:latest
      script: |
        #!/bin/bash
        set -e

        STACK_JSON='$(params.stack-json)'
        BUILD_APPS="$(params.build-apps)"
        CHAIN="$(params.propagation-chain)"
        BUILT='$(params.built-images)'
        INTERCEPT="$(params.intercept-header-value)"
        DEFAULT_NS="$(params.default-namespace)"
        MIRRORD_IMAGE="$(params.mirrord-image)"
        PROXY_SA="$(params.proxy-service-account)"
        DEPLOYED_PODS_FILE="$(workspaces.shared-workspace.path)/deployed-pods.json"

        echo "============================================="
        echo "  mirrord Intercept Deployment"
        echo "============================================="
        echo "  Build apps:       $BUILD_APPS"
        echo "  Intercept header: $INTERCEPT"
        echo "  Namespace:        $DEFAULT_NS"
        echo ""

        echo '{}' > /tmp/pods.json

        for APP in $BUILD_APPS; do
          echo "========================================="
          echo "  Deploying intercept: $APP"
          echo "========================================="

          IMAGE=$(echo "$BUILT" | jq -r --arg a "$APP" '.[$a]')
          NS=$(echo "$STACK_JSON" | jq -r --arg a "$APP" --arg d "$DEFAULT_NS" \
            '(.defaults.namespace // $d) as $dn | .apps[]|select(.name==$a)|.namespace // $dn')
          CPORT=$(echo "$STACK_JSON" | jq -r --arg a "$APP" \
            '(.defaults."container-port" // "8080") as $dp | .apps[]|select(.name==$a)|."container-port" // $dp')

          TS=$(date +%s)
          POD_NAME="pr-${APP}-${TS}"
          PROXY_NAME="mirrord-proxy-${APP}-${TS}"
          CM_NAME="mirrord-config-${APP}-${TS}"

          BAGGAGE_ROLE=$(echo "$STACK_JSON" | jq -r --arg a "$APP" '
            (.apps[] | select(.name==$a)) as $app |
            ($app.downstream // []) as $down |
            $app."propagation-role" // (
              if ($down|length)==0 then "terminal"
              elif (($app.role // "")|ascii_downcase)=="frontend" then "originator"
              else "forwarder" end)
          ')
          BAGGAGE_HEADER=$(echo "$STACK_JSON" | jq -r '.propagation."header-name" // "x-dev-session"')
          BAGGAGE_KEY=$(echo "$STACK_JSON" | jq -r '.propagation."baggage-key" // "dev-session"')
          DOWNSTREAM_URL=$(echo "$STACK_JSON" | jq -r --arg a "$APP" '
            (.apps[] | select(.name==$a) | .downstream // []) as $down |
            if ($down|length)>0 then "http://" + ($down[0]|tostring) else empty end
          ')

          echo "  Deploying PR pod: $POD_NAME in $NS"
          echo "  Baggage:   role=$BAGGAGE_ROLE header=$BAGGAGE_HEADER"
          cat <<PRPOD | kubectl apply -f -
        apiVersion: v1
        kind: Pod
        metadata:
          name: ${POD_NAME}
          namespace: ${NS}
          labels:
            app: pr-test
            component: ${APP}
            managed-by: tekton-job-standardization
        spec:
          containers:
          - name: pr-component
            image: ${IMAGE}
            ports:
            - containerPort: ${CPORT}
            env:
            - name: BAGGAGE_ENABLED
              value: "true"
            - name: BAGGAGE_ROLE
              value: "${BAGGAGE_ROLE}"
            - name: BAGGAGE_HEADER_NAME
              value: "${BAGGAGE_HEADER}"
            - name: BAGGAGE_KEY
              value: "${BAGGAGE_KEY}"
            - name: APP_NAME
              value: "${APP}"
            - name: DOWNSTREAM_URL
              value: "${DOWNSTREAM_URL}"
            - name: BFF_UPSTREAM
              value: "${DOWNSTREAM_URL}"
        PRPOD

          kubectl wait --for=condition=Ready "pod/${POD_NAME}" --namespace "$NS" --timeout=300s
          PR_POD_IP=$(kubectl get pod "$POD_NAME" -n "$NS" -o jsonpath='{.status.podIP}')
          echo "  PR pod ready: $POD_NAME (IP: $PR_POD_IP)"

          # mirrord config: steal traffic matching header, target the deployment (original app).
          # mirrord evaluates http_filter.header_filter as a regex against the
          # string "<name>: <value>" (colon + space). The param is "name:value"
          # with no space, so passing it verbatim never matched (2026-09-27,
          # found on local kind). Build an anchored, case-insensitive filter.
          if [ -n "$INTERCEPT" ]; then
            HDR_NAME="${INTERCEPT%%:*}"
            HDR_VAL="${INTERCEPT#*:}"
            HDR_VAL="${HDR_VAL# }"
            HEADER_FILTER="(?i)^${HDR_NAME}: ${HDR_VAL}\$"
          else
            HEADER_FILTER=".*"
          fi
          echo "  mirrord header_filter: ${HEADER_FILTER}"
          MIRRORD_CONFIG=$(jq -n \
            --arg path "deployment/${APP}" \
            --arg ns "$NS" \
            --arg header "$HEADER_FILTER" \
            '{
              target: { path: $path, namespace: $ns },
              agent: { namespace: $ns },
              feature: {
                network: {
                  incoming: { mode: "steal", http_filter: { header_filter: $header } },
                  outgoing: true
                },
                fs: "local"
              }
            }')

          kubectl create configmap "$CM_NAME" --namespace "$NS" --from-literal=config.json="$MIRRORD_CONFIG"

          echo "  Deploying mirrord proxy: $PROXY_NAME"
          cat <<PROXYPOD | kubectl apply -f -
        apiVersion: v1
        kind: Pod
        metadata:
          name: ${PROXY_NAME}
          namespace: ${NS}
          labels:
            app: mirrord-proxy
            component: ${APP}
            managed-by: tekton-job-standardization
        spec:
          serviceAccountName: ${PROXY_SA}
          hostPID: true
          restartPolicy: Never
          containers:
          - name: mirrord-proxy
            image: ${MIRRORD_IMAGE}
            command: ["/bin/sh"]
            args:
            - -c
            - |
              set -e
              export HOME=/tmp
              echo "Starting mirrord proxy for ${APP} -> ${PR_POD_IP}:${CPORT}"
              exec /usr/local/bin/mirrord exec -f /config/config.json -- socat TCP-LISTEN:${CPORT},fork TCP:${PR_POD_IP}:${CPORT}
            env:
            - name: HOME
              value: /tmp
            - name: MIRRORD_TELEMETRY
              value: "false"
            - name: MIRRORD_PROGRESS_MODE
              value: "off"
            # INFO gives the gate below its positive marker:
            # 'Created agent pod ... pod_name: "mirrord-agent-..."'.
            # (mirrord still prints a non-fatal
            # 'ERROR mirrord::connection: failed to obtain machine ID'.)
            - name: RUST_LOG
              value: "mirrord=info"
            - name: PR_POD_IP
              value: "${PR_POD_IP}"
            - name: CPORT
              value: "${CPORT}"
            volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            securityContext:
              runAsUser: 0
              privileged: true
              capabilities:
                add: [SYS_ADMIN, SYS_PTRACE, NET_ADMIN]
          volumes:
          - name: config
            configMap:
              name: ${CM_NAME}
        PROXYPOD

          # Fail closed, with a positive marker. A Ready flicker is not proof:
          # with no readiness probe a container is Ready the instant it runs,
          # and mirrord exec can fail seconds later. Observed on kind: the
          # proxy logs 'Created agent pod' at ~1s; without pods/portforward
          # RBAC the WebSocket upgrade 403s at ~+17s and the agent gives up at
          # ~+30s. So require: proxy Running, zero restarts, no fatal log
          # line, the agent pod named in the proxy log Running, and all of
          # that still true 40s after the agent pod was first seen. The
          # proxy's own IP:port is NOT probed - under the mirrord layer socat's
          # listener is virtual; routing is proven in validate-propagation.
          PROXY_OK=false
          AGENT_POD=""
          AGENT_SEEN=0
          DEADLINE=$(( $(date +%s) + 180 ))
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            PHASE=$(kubectl get "pod/${PROXY_NAME}" -n "$NS" -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            RESTARTS=$(kubectl get "pod/${PROXY_NAME}" -n "$NS" -o jsonpath='{.status.containerStatuses[0].restartCount}' 2>/dev/null || echo "0")
            PROXY_LOG=$(kubectl logs "pod/${PROXY_NAME}" -n "$NS" 2>/dev/null || true)
            # Fatal log lines only. A generic "ERROR mirrord::..." is not
            # fatal (the machine-ID telemetry lookup); a real crash ends the
            # process and, with restartPolicy Never, moves the pod to Failed.
            if [ "$PHASE" = "Failed" ] || [ "$PHASE" = "Succeeded" ] || [ "${RESTARTS:-0}" != "0" ] \
              || printf '%s' "$PROXY_LOG" | grep -Eq 'Failed to create mirrord-agent|Failed to connect to the created mirrord-agent|Forbidden|^Error:|agent (connection|creation) (failed|timed out)'; then
              break
            fi
            if [ -z "$AGENT_POD" ]; then
              AGENT_POD=$(printf '%s' "$PROXY_LOG" | sed -n 's/.*Created agent pod.*pod_name: "\([^"]*\)".*/\1/p' | head -n 1)
              [ -z "$AGENT_POD" ] || AGENT_SEEN=$(date +%s)
            fi
            if [ "$PHASE" = "Running" ] && [ -n "$AGENT_POD" ]; then
              AGENT_PHASE=$(kubectl get "pod/${AGENT_POD}" -n "$NS" -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
              if [ "$AGENT_PHASE" = "Failed" ] || [ "$AGENT_PHASE" = "Succeeded" ]; then
                break
              fi
              if [ "$AGENT_PHASE" = "Running" ] && [ $(( $(date +%s) - AGENT_SEEN )) -ge 40 ]; then
                PROXY_OK=true
                break
              fi
            fi
            sleep 3
          done
          if ! $PROXY_OK; then
            echo "ERROR: mirrord proxy ${PROXY_NAME} did not establish an agent connection (proxy phase=${PHASE:-?} restarts=${RESTARTS:-?} agent=${AGENT_POD:-none} agent phase=${AGENT_PHASE:-?})" >&2
            echo "--- proxy pod log ---" >&2
            kubectl logs "pod/${PROXY_NAME}" -n "$NS" 2>&1 | tail -n 60 >&2 || true
            echo "--- proxy pod describe ---" >&2
            kubectl describe "pod/${PROXY_NAME}" -n "$NS" 2>&1 | tail -n 40 >&2 || true
            echo "--- mirrord agent jobs/pods in $NS ---" >&2
            kubectl get jobs,pods -n "$NS" -l app=mirrord 2>&1 >&2 || true
            if [ -n "$AGENT_POD" ]; then
              echo "--- mirrord agent log (${AGENT_POD}) ---" >&2
              kubectl logs "pod/${AGENT_POD}" -n "$NS" --tail=-1 2>&1 | tail -n 60 >&2 || true
            fi
            exit 1
          fi
          echo "  Proxy ${PROXY_NAME} connected to agent ${AGENT_POD}; both Running 40s, 0 restarts (routing is proven in validate-propagation)"
          echo "  Intercept active for $APP (traffic with header -> PR pod $POD_NAME)"
          echo ""

          jq --arg a "$APP" --arg p "$POD_NAME" '. + {($a): $p}' /tmp/pods.json > /tmp/pods-tmp.json
          mv /tmp/pods-tmp.json /tmp/pods.json
        done

        mkdir -p "$(dirname "${DEPLOYED_PODS_FILE}")"
        cat /tmp/pods.json > "$DEPLOYED_PODS_FILE"
        cat /tmp/pods.json | tee $(results.deployed-pods.path)
