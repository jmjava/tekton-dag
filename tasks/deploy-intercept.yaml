apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-stack-intercepts
  labels:
    app.kubernetes.io/part-of: tekton-job-standardization
    app.kubernetes.io/version: "1.0.0"
spec:
  description: >
    Deploys PR pods with Telepresence intercepts ONLY for the app(s)
    that changed. The rest of the stack runs as-is in the cluster.

    For a stack A→B→C→D where C changed:
      - A, B, D: normal deployed services (untouched)
      - C: Telepresence intercepts the existing C service so that
            requests carrying the PR's baggage header get routed
            to the PR pod running the new C build
      - The e2e test enters through A with the header; B forwards
            it to C (intercepted → PR pod); C forwards to D normally.

    The intercept-header-value (e.g. x-dev-session:pr-42) is what
    Telepresence matches on. Only traffic with that header hits the
    PR pod — all other traffic continues to the normal C deployment.
  params:
    - name: stack-json
      type: string
      description: "Full stack graph JSON (used to resolve ports, namespaces, topology)"
    - name: build-apps
      type: string
      description: "Space-separated list of apps that were built (ONLY these get intercepts)"
    - name: propagation-chain
      type: string
      default: ""
      description: "Full ordered chain from entry to leaf (for logging context)"
    - name: built-images
      type: string
      description: "JSON map of app → image URI"
    - name: intercept-header-value
      type: string
      description: "Header match expression for Telepresence (e.g. x-dev-session:pr-42)"
    - name: default-namespace
      type: string
      default: "staging"
    - name: telepresence-image
      type: string
      default: "localhost:5000/tekton-dag-build-telepresence:latest"
  workspaces:
    - name: shared-workspace
      optional: true
      description: "Workspace to write deployed-pods.json for pass-through result (M7)"
  results:
    - name: deployed-pods
      description: "JSON map of app → pod name"
  steps:
    - name: deploy
      image: bitnami/kubectl:latest
      script: |
        #!/bin/bash
        set -e

        STACK_JSON='$(params.stack-json)'
        BUILD_APPS="$(params.build-apps)"
        CHAIN="$(params.propagation-chain)"
        BUILT='$(params.built-images)'
        INTERCEPT="$(params.intercept-header-value)"
        DEFAULT_NS="$(params.default-namespace)"

        # Compute the full app list from the graph for context
        ALL_APPS=$(echo "$STACK_JSON" | jq -r '.apps[].name' | tr '\n' ' ')

        echo "============================================="
        echo "  Intercept Deployment Plan"
        echo "============================================="
        echo "  Full stack apps:    $ALL_APPS"
        echo "  Propagation chain:  ${CHAIN:-<not provided>}"
        echo "  Intercepted apps:   $BUILD_APPS"
        echo "  Intercept header:   $INTERCEPT"
        echo ""
        echo "  Apps NOT intercepted run their normal cluster deployments."
        echo "  Only traffic matching the header routes to PR pods."
        echo ""

        # Show each intercepted app's propagation role and chain position
        for APP in $BUILD_APPS; do
          PROP_ROLE=$(echo "$STACK_JSON" | jq -r --arg a "$APP" \
            '.apps[]|select(.name==$a)|."propagation-role" // "unknown"')

          echo "  $APP:"
          echo "    propagation-role: $PROP_ROLE"

          # Check if there are other intercepted apps downstream of this one
          HAS_DOWNSTREAM_INTERCEPT=false
          FOUND_SELF=false
          for C in $CHAIN; do
            if [ "$C" = "$APP" ]; then
              FOUND_SELF=true
              continue
            fi
            if $FOUND_SELF; then
              for BA in $BUILD_APPS; do
                [ "$BA" = "$C" ] && HAS_DOWNSTREAM_INTERCEPT=true
              done
            fi
          done

          case "$PROP_ROLE" in
            originator)
              echo "    behavior: STARTS the baggage chain"
              if $HAS_DOWNSTREAM_INTERCEPT; then
                echo "    app code: must set headers on outgoing requests (intercepted app downstream)"
              else
                echo "    app code: must set headers on outgoing requests"
                echo "    note: no other intercepted apps downstream — header only needed to reach THIS app"
              fi
              ;;
            forwarder)
              if $HAS_DOWNSTREAM_INTERCEPT; then
                echo "    behavior: ACCEPTS incoming baggage and MUST FORWARD (intercepted app downstream)"
                echo "    app code: must parse incoming header, store in context, propagate on all outgoing calls"
              else
                echo "    behavior: ACCEPTS incoming baggage, downstream calls are NORMAL"
                echo "    app code: header got traffic here via Telepresence — downstream calls go to"
                echo "              normal deployments, no forwarding needed for intercept routing"
              fi
              ;;
            terminal)
              echo "    behavior: ACCEPTS incoming baggage, never forwards"
              echo "    app code: header got traffic here — end of the line"
              ;;
          esac

          # Chain position context
          if [ -n "$CHAIN" ]; then
            POSITION=0
            TOTAL=0
            for C in $CHAIN; do
              TOTAL=$((TOTAL + 1))
              if [ "$C" = "$APP" ]; then
                POSITION=$TOTAL
              fi
            done
            if [ $POSITION -gt 0 ]; then
              echo "    chain position: $POSITION of $TOTAL"
              UPSTREAM=""
              DOWNSTREAM=""
              FOUND=false
              for C in $CHAIN; do
                if [ "$C" = "$APP" ]; then
                  FOUND=true
                  continue
                fi
                if $FOUND; then
                  DOWNSTREAM="$DOWNSTREAM $C"
                else
                  UPSTREAM="$UPSTREAM $C"
                fi
              done
              [ -n "$UPSTREAM" ] && echo "    upstream (normal):   $UPSTREAM"
              [ -n "$DOWNSTREAM" ] && echo "    downstream (normal): $DOWNSTREAM"
            else
              echo "    chain position: leaf (fan-out target)"
            fi
          fi
          echo ""
        done

        echo '{}' > /tmp/pods.json

        for APP in $BUILD_APPS; do
          echo "========================================="
          echo "  Deploying intercept: $APP"
          echo "========================================="

          IMAGE=$(echo "$BUILT" | jq -r --arg a "$APP" '.[$a]')
          NS=$(echo "$STACK_JSON" | jq -r --arg a "$APP" --arg d "$DEFAULT_NS" \
            '(.defaults.namespace // $d) as $dn | .apps[]|select(.name==$a)|.namespace // $dn')
          CPORT=$(echo "$STACK_JSON" | jq -r --arg a "$APP" \
            '(.defaults."container-port" // "8080") as $dp | .apps[]|select(.name==$a)|."container-port" // $dp')
          SPORT=$(echo "$STACK_JSON" | jq -r --arg a "$APP" \
            '(.defaults."service-port" // "80") as $dp | .apps[]|select(.name==$a)|."service-port" // $dp')

          POD_NAME="pr-${APP}-$(date +%s)"

          BAGGAGE_ROLE=$(echo "$STACK_JSON" | jq -r --arg a "$APP" '
            (.apps[] | select(.name==$a)) as $app |
            ($app.downstream // []) as $down |
            $app."propagation-role" // (
              if ($down|length)==0 then "terminal"
              elif (($app.role // "")|ascii_downcase)=="frontend" then "originator"
              else "forwarder" end)
          ')
          HEADER_NAME=$(echo "$STACK_JSON" | jq -r '.propagation."header-name" // "x-dev-session"')
          BAGGAGE_KEY=$(echo "$STACK_JSON" | jq -r '.propagation."baggage-key" // "dev-session"')
          DOWNSTREAM_URL=$(echo "$STACK_JSON" | jq -r --arg a "$APP" '
            (.apps[] | select(.name==$a) | .downstream // []) as $down |
            if ($down|length)>0 then "http://" + ($down[0]|tostring) else empty end
          ')

          echo "  Image:     $IMAGE"
          echo "  Namespace: $NS"
          echo "  Ports:     container=$CPORT  service=$SPORT"
          echo "  Intercept: $INTERCEPT"
          echo "  Pod:       $POD_NAME"
          echo "  Baggage:   role=$BAGGAGE_ROLE header=$HEADER_NAME"

          if [ -z "$INTERCEPT" ]; then
            echo "ERROR: intercept header is required so unmatched traffic stays on baseline" >&2
            exit 1
          fi
          HTTP_HEADER="${INTERCEPT%%:*}=${INTERCEPT#*:}"
          HTTP_MATCH="--http-header '${HTTP_HEADER}'"

          cat <<PRPOD | kubectl apply -f -
        apiVersion: v1
        kind: Pod
        metadata:
          name: ${POD_NAME}
          namespace: ${NS}
          labels:
            app: pr-test
            component: ${APP}
            managed-by: tekton-job-standardization
        spec:
          containers:
          - name: pr-component
            image: ${IMAGE}
            ports:
            - containerPort: ${CPORT}
            env:
            - name: BAGGAGE_ENABLED
              value: "true"
            - name: BAGGAGE_ROLE
              value: "${BAGGAGE_ROLE}"
            - name: BAGGAGE_HEADER_NAME
              value: "${HEADER_NAME}"
            - name: BAGGAGE_KEY
              value: "${BAGGAGE_KEY}"
            - name: APP_NAME
              value: "${APP}"
            - name: DOWNSTREAM_URL
              value: "${DOWNSTREAM_URL}"
            - name: BFF_UPSTREAM
              value: "${DOWNSTREAM_URL}"
        PRPOD

          kubectl wait --for=condition=Ready "pod/${POD_NAME}" \
            --namespace "$NS" --timeout=300s
          PR_POD_IP=$(kubectl get pod "$POD_NAME" -n "$NS" -o jsonpath='{.status.podIP}')
          echo "  Pod ready: $POD_NAME (IP: $PR_POD_IP)"

          CLIENT_NAME="tp-client-${APP}-$(date +%s)"
          echo "  Deploying telepresence client: $CLIENT_NAME"
          cat <<CLIENTPOD | kubectl apply -f -
        apiVersion: v1
        kind: Pod
        metadata:
          name: ${CLIENT_NAME}
          namespace: ${NS}
          labels:
            app: telepresence-client
            component: ${APP}
            managed-by: tekton-job-standardization
        spec:
          serviceAccountName: telepresence-intercept
          containers:
          - name: telepresence
            image: $(params.telepresence-image)
            env:
            - name: HOME
              value: /tmp
            - name: SCOUT_DISABLE
              value: "1"
            - name: TELEPRESENCE_LOGIN_DISABLED
              value: "1"
            command: ["/bin/sh"]
            args:
            - -c
            - |
              set -e
              export HOME=/tmp
              SA=/var/run/secrets/kubernetes.io/serviceaccount
              TOKEN=\$(cat "\$SA/token")
              printf '%s\n' \
                'apiVersion: v1' \
                'kind: Config' \
                'clusters:' \
                '- cluster:' \
                "    certificate-authority: \$SA/ca.crt" \
                '    server: https://kubernetes.default.svc:443' \
                '  name: in-cluster' \
                'contexts:' \
                '- context:' \
                '    cluster: in-cluster' \
                '    namespace: ${NS}' \
                '    user: sa' \
                '  name: in-cluster' \
                'current-context: in-cluster' \
                'users:' \
                '- name: sa' \
                '  user:' \
                "    token: \$TOKEN" \
                > /tmp/kubeconfig
              export KUBECONFIG=/tmp/kubeconfig
              mkdir -p /dev/net
              [ -c /dev/net/tun ] || mknod /dev/net/tun c 10 200
              echo "telepresence version:"
              /usr/local/bin/telepresence version
              echo "connecting to traffic-manager..."
              /usr/local/bin/telepresence connect --manager-namespace ambassador --namespace ${NS} --mapped-namespaces ${NS} --never-proxy ${PR_POD_IP}/32
              echo "waiting for telepresence daemons..."
              i=0
              until /usr/local/bin/telepresence status 2>/dev/null | grep -qiE 'Status[[:space:]]*:[[:space:]]*Connected|Connected to context'; do
                i=\$((i+1))
                if [ "\$i" -gt 30 ]; then
                  echo "telepresence status after connect:"
                  /usr/local/bin/telepresence status || true
                  break
                fi
                sleep 2
              done
              export PR_HOST=${PR_POD_IP}
              export PR_PORT=${CPORT}
              export LIVE_HOST=127.0.0.1
              export LIVE_PORT=18081
              export HEADER_NAME=${INTERCEPT%%:*}
              export HEADER_VALUE=${INTERCEPT#*:}
              export ROUTER_PORT=18080
              echo "starting header router ${HEADER_NAME}=${HEADER_VALUE} -> PR ${PR_POD_IP}:${CPORT} else 127.0.0.1:18081"
              /usr/local/bin/tp-header-router &
              echo "creating TCP intercept ${APP} on localhost:18080..."
              set +e
              /usr/local/bin/telepresence intercept ${APP} --port 18080
              irc=\$?
              set -e
              if [ "\$irc" -ne 0 ]; then
                echo "intercept exited \$irc — listing current intercepts"
                /usr/local/bin/telepresence list || true
                if /usr/local/bin/telepresence list 2>/dev/null | grep -qi "${APP}"; then
                  echo "continuing with existing intercept for ${APP}"
                else
                  echo "ERROR: intercept failed and ${APP} is not listed" >&2
                  exit 1
                fi
              fi
              echo "waiting for ${APP} rollout after agent inject..."
              kubectl rollout status "deploy/${APP}" -n ${NS} --timeout=120s || true
              LIVE_POD=\$(kubectl get pod -n ${NS} -l app=${APP} --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}')
              APP_CONTAINER=\$(kubectl get pod "\$LIVE_POD" -n ${NS} -o jsonpath='{range .spec.containers[*]}{.name}{"\\n"}{end}' | grep -vE '^(traffic-agent|istio-proxy|linkerd-proxy)\$' | head -1)
              echo "port-forward live app \$LIVE_POD container \$APP_CONTAINER :${CPORT} -> 127.0.0.1:18081"
              kubectl port-forward -n ${NS} --address 127.0.0.1 --container "\$APP_CONTAINER" "pod/\$LIVE_POD" 18081:${CPORT} &
              j=0
              until python3 -c 'import socket;s=socket.socket();s.settimeout(1);s.connect(("127.0.0.1",18081));s.close()' 2>/dev/null; do
                j=\$((j+1))
                if [ "\$j" -gt 30 ]; then
                  echo "ERROR: live app port-forward did not become ready" >&2
                  exit 1
                fi
                sleep 2
              done
              echo "Intercept active for ${APP}!"
              echo "Intercepting HTTP header ${INTERCEPT}"
              tail -f /dev/null
            securityContext:
              runAsUser: 0
              privileged: true
              capabilities:
                add: [NET_ADMIN, NET_RAW]
        CLIENTPOD

          echo "  Waiting until telepresence reports the intercept is active"
          deadline=$((SECONDS + 180))
          until kubectl logs "pod/${CLIENT_NAME}" -n "$NS" 2>/dev/null \
              | grep -q "Intercept active for ${APP}!" \
            && kubectl logs "pod/${CLIENT_NAME}" -n "$NS" 2>/dev/null \
              | grep -qiE 'header-router listening|Intercepting HTTP header'; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "ERROR: intercept for ${APP} did not become active" >&2
              echo "=== client status ===" >&2
              kubectl get pod "${CLIENT_NAME}" -n "$NS" -o jsonpath='{.status.phase} {.status.containerStatuses}' >&2 || true
              echo >&2
              echo "=== previous client logs ===" >&2
              kubectl logs "pod/${CLIENT_NAME}" -n "$NS" --previous >&2 || true
              echo "=== current client logs ===" >&2
              kubectl logs "pod/${CLIENT_NAME}" -n "$NS" >&2 || true
              exit 1
            fi
            sleep 5
          done
          echo "  Traffic to $APP matching '$INTERCEPT' now routes to PR pod"
          echo ""

          jq --arg a "$APP" --arg p "$POD_NAME" '. + {($a): $p}' \
            /tmp/pods.json > /tmp/pods-tmp.json
          mv /tmp/pods-tmp.json /tmp/pods.json
        done

        # Write to result and optionally to workspace for deploy-intercepts-result pass-through (M7)
        cat /tmp/pods.json | tee $(results.deployed-pods.path)
        WS_PATH="$(workspaces.shared-workspace.path)"
        if [ -n "${WS_PATH}" ]; then
          DEPLOYED_PODS_FILE="${WS_PATH}/deployed-pods.json"
          mkdir -p "$(dirname "${DEPLOYED_PODS_FILE}")"
          cp /tmp/pods.json "${DEPLOYED_PODS_FILE}"
        fi