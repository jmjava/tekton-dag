          #!/bin/sh
          set -e

          APP="demo-fe"
          RADIUS="1"
          URL="http://tekton-dag-orchestrator.tekton-pipelines.svc.cluster.local:8080/api/test-plan?app=${APP}&radius=${RADIUS}"

          echo "Querying test plan: $URL"
          RESPONSE=$(curl -sf "$URL" 2>/dev/null || echo '{"error":"orchestrator unreachable"}')
          echo "$RESPONSE" | head -c 2000
          echo ""

          if echo "$RESPONSE" | grep -q '"error"'; then
            echo "WARN: test-plan query failed; will run all tests"
            echo -n "" > /tekton/results/tests-to-run
            echo -n "" > /tekton/results/unmapped-area
            echo -n "" > /tekton/results/apps-to-test
