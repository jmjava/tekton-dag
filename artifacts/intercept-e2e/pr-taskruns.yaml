    taskSpec:
      description: |
        Fail-closed check that the original override header is transferred hop-to-hop up to the intercepted app(s). A rewritten or dropped value (e.g. pr-42 → local-debug) fails the task: intercepts only match the original session.
        The header only needs to propagate from the entry point UP TO the intercepted app. Beyond the intercept, downstream calls are normal — there's no Telepresence intercept on those services to match on, so the header doesn't need to be there.
        Example: A(originator) → B(forwarder) → C(terminal), D(terminal)
          If B is intercepted:
            - Header must reach B (A originates → B receives via Telepresence)
            - B's calls to C and D are normal calls to normal deployments
            - C and D do NOT need the header — no intercept to match
          If C is intercepted:
            - Header must reach C (A originates → B forwards → C receives)
            - D is untouched
          If B AND C are intercepted:
            - Header must reach B AND continue to C
            - B must forward because there's another intercept downstream
      params:
      - description: Full stack graph JSON
        name: stack-json
        type: string
      - description: Space-separated ordered list of apps in the chain
        name: propagation-chain
        type: string
      - default: ""
        description: Space-separated list of intercepted apps
        name: build-apps
        type: string
      - description: Header value used for intercepts (e.g. x-dev-session:pr-42)
        name: intercept-header-value
        type: string
      - default: staging
        name: default-namespace
        type: string
      - default: ""
        description: |
          JSON map app -> PR pod name from deploy-intercepts. When non-empty the
          task also proves routing: a header-matched request must be served by
          that PR pod and an unmatched request must not be (read from the pod's
          access log through the Kubernetes API).
        name: deployed-pods
        type: string
      steps:
      - computeResources: {}
        image: alpine:3.19
        name: validate
        script: |
          #!/bin/sh
          set -e
          apk add --no-cache curl jq >/dev/null 2>&1

          STACK_JSON='{"name":"stack-one","description":"Demo 3-tier stack: Frontend (Vue) → BFF middleware (Spring Boot) → REST API persistence (Spring Boot)","propagation":{"header-name":"x-dev-session","baggage-key":"dev-session","strategy":"w3c-baggage"},"defaults":{"namespace":"staging","image-registry":"${IMAGE_REGISTRY}","service-port":"80","container-port":"8080"},"apps":[{"name":"demo-fe","repo":"jmjava/tekton-dag-vue-fe","role":"frontend","propagation-role":"originator","namespace":null,"container-port":"80","service-port":null,"context-dir":".","dockerfile":"Dockerfile","build":{"tool":"npm","runtime":"vue","node-version":"22","build-command":"npm install && npm run build"},"downstream":["release-lifecycle-demo"],"tests":{"postman":"tests/postman/fe-tests.json","playwright":"tests/playwright","artillery":"tests/artillery/load-test.yml"}},{"name":"release-lifecycle-demo","repo":"jmjava/tekton-dag-spring-boot","role":"middleware","propagation-role":"forwarder","namespace":null,"container-port":null,"service-port":null,"context-dir":".","dockerfile":"Dockerfile","build":{"tool":"maven","runtime":"spring-boot","java-version":"21","build-command":"mvn -B clean package -DskipTests"},"downstream":["demo-api"],"tests":{"postman":"tests/postman/bff-tests.json"}},{"name":"demo-api","repo":"jmjava/tekton-dag-spring-boot-gradle","role":"persistence","propagation-role":"terminal","namespace":null,"container-port":null,"service-port":null,"context-dir":".","dockerfile":"Dockerfile","build":{"tool":"maven","runtime":"spring-boot","java-version":"21","build-command":"mvn -B clean package -DskipTests"},"downstream":[],"tests":{"postman":"tests/postman/api-tests.json"}}]}
          '
          CHAIN="demo-fe release-lifecycle-demo demo-api
          "
          BUILD_APPS="demo-fe"
          INTERCEPT="x-dev-session:pr-903"
          DEFAULT_NS="staging"

          HEADER_NAME=$(echo "$STACK_JSON" | jq -r '.propagation."header-name" // "x-dev-session"')
          BAGGAGE_KEY=$(echo "$STACK_JSON" | jq -r '.propagation."baggage-key" // "dev-session"')

          HEADER_VAL=""
          if [ -n "$INTERCEPT" ]; then
            HEADER_VAL=$(echo "$INTERCEPT" | cut -d: -f2-)
          fi

          COUNT=0
          for APP in $CHAIN; do COUNT=$((COUNT + 1)); done

          # Find the deepest intercepted app in the chain
          # Header only needs to propagate up to this point
          DEEPEST_INTERCEPT_POS=0
          POS=0
          for APP in $CHAIN; do
            POS=$((POS + 1))
            for BA in $BUILD_APPS; do
              if [ "$BA" = "$APP" ]; then
                DEEPEST_INTERCEPT_POS=$POS
              fi
            done
          done

          echo "============================================="
          echo "  Stack Propagation Validation"
          echo "============================================="
          echo "  Chain:              $CHAIN"
          echo "  Header:             $HEADER_NAME = $HEADER_VAL"
          echo "  Baggage key:        $BAGGAGE_KEY"
          echo "  Hop count:          $COUNT"
          echo "  Intercepted:        ${BUILD_APPS:-<none>}"
          echo "  Deepest intercept:  position $DEEPEST_INTERCEPT_POS of $COUNT"
          echo ""

          # Show the propagation contract for each hop
          echo "  Propagation contract:"
          HOP=0
          PAST_DEEPEST=false
          for APP in $CHAIN; do
            HOP=$((HOP + 1))
            PROP_ROLE=$(echo "$STACK_JSON" | jq -r --arg a "$APP" \
              '.apps[]|select(.name==$a)|."propagation-role" // "unknown"')

            IS_INTERCEPTED=false
            for BA in $BUILD_APPS; do
              [ "$BA" = "$APP" ] && IS_INTERCEPTED=true
            done

            if [ $HOP -gt $DEEPEST_INTERCEPT_POS ] && [ $DEEPEST_INTERCEPT_POS -gt 0 ]; then
              PAST_DEEPEST=true
            fi

            TAG=""
            $IS_INTERCEPTED && TAG=" ** PR BUILD **"

            if $PAST_DEEPEST; then
              echo "    $HOP. $APP ($PROP_ROLE) → NORMAL call (no intercept downstream, header not required)"
            else
              case "$PROP_ROLE" in
                originator) echo "    $HOP. $APP ($PROP_ROLE)${TAG} → SETS header, sends to next hop" ;;
                forwarder)
                  # Only needs to forward if there's another intercepted app downstream
                  HAS_DOWNSTREAM_INTERCEPT=false
                  CHECK_POS=0
                  for C in $CHAIN; do
                    CHECK_POS=$((CHECK_POS + 1))
                    if [ $CHECK_POS -gt $HOP ]; then
                      for BA in $BUILD_APPS; do
                        [ "$BA" = "$C" ] && HAS_DOWNSTREAM_INTERCEPT=true
                      done
                    fi
                  done

                  if $IS_INTERCEPTED && ! $HAS_DOWNSTREAM_INTERCEPT; then
                    echo "    $HOP. $APP ($PROP_ROLE)${TAG} → RECEIVES header via intercept, downstream calls are NORMAL (no forwarding needed)"
                  elif $IS_INTERCEPTED && $HAS_DOWNSTREAM_INTERCEPT; then
                    echo "    $HOP. $APP ($PROP_ROLE)${TAG} → RECEIVES header via intercept, MUST FORWARD (intercepted app downstream)"
                  elif $HAS_DOWNSTREAM_INTERCEPT; then
                    echo "    $HOP. $APP ($PROP_ROLE) → RECEIVES header, MUST FORWARD (intercepted app downstream)"
                  else
                    echo "    $HOP. $APP ($PROP_ROLE) → RECEIVES header, downstream calls NORMAL"
                  fi
                  ;;
                terminal) echo "    $HOP. $APP ($PROP_ROLE)${TAG} → RECEIVES header, END of chain" ;;
                *)        echo "    $HOP. $APP ($PROP_ROLE)${TAG}" ;;
              esac
            fi
          done
          echo ""

          if [ "$COUNT" -le 1 ]; then
            echo "Single-app stack — health check only."
            ENTRY=$(echo $CHAIN | awk '{print $1}')
            NS=$(echo "$STACK_JSON" | jq -r --arg a "$ENTRY" --arg d "$DEFAULT_NS" \
              '(.defaults.namespace // $d) as $dn | .apps[]|select(.name==$a)|.namespace // $dn')
            SPORT=$(echo "$STACK_JSON" | jq -r --arg a "$ENTRY" \
              '(.defaults."service-port" // "80") as $dp | .apps[]|select(.name==$a)|."service-port" // $dp')
            URL="http://${ENTRY}.${NS}.svc.cluster.local:${SPORT}/propagation"

            echo "  Health check: $URL"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "${HEADER_NAME}: ${HEADER_VAL}" \
              -H "baggage: ${BAGGAGE_KEY}=${HEADER_VAL}" \
              --connect-timeout 10 --max-time 30 \
              "$URL" 2>/dev/null || echo "000")

            if [ "$HTTP_CODE" = "000" ]; then
              echo "  WARN: Service not reachable (may be expected in dry-run)"
            elif [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
              echo "  PASS: HTTP $HTTP_CODE"
            else
              echo "  WARN: HTTP $HTTP_CODE (non-fatal for PR validation)"
            fi
            exit 0
          fi

          # Multi-hop validation — enter through the originator
          ENTRY=$(echo $CHAIN | awk '{print $1}')
          NS=$(echo "$STACK_JSON" | jq -r --arg a "$ENTRY" --arg d "$DEFAULT_NS" \
            '(.defaults.namespace // $d) as $dn | .apps[]|select(.name==$a)|.namespace // $dn')
          SPORT=$(echo "$STACK_JSON" | jq -r --arg a "$ENTRY" \
            '(.defaults."service-port" // "80") as $dp | .apps[]|select(.name==$a)|."service-port" // $dp')
          BASE="http://${ENTRY}.${NS}.svc.cluster.local:${SPORT}"
          TRACEPARENT="00-$(cat /dev/urandom | tr -dc 'a-f0-9' | head -c 32)-$(cat /dev/urandom | tr -dc 'a-f0-9' | head -c 16)-01"

          fetch_originator() {
            body_file=$(mktemp)
            http_code=$(curl -s -o "$body_file" -w "%{http_code}" \
              -H "${HEADER_NAME}: ${HEADER_VAL}" \
              -H "baggage: ${BAGGAGE_KEY}=${HEADER_VAL}" \
              -H "traceparent: ${TRACEPARENT}" \
              --connect-timeout 10 --max-time 60 \
              "$1" 2>/dev/null || true)
            [ -n "$http_code" ] || http_code="000"
            printf '%s' "$http_code" > /tmp/originator-http-code
            cat "$body_file"
            rm -f "$body_file"
          }

          URL="${BASE}/propagation"
          echo "Sending test request to originator: $URL"
          echo "  Headers: ${HEADER_NAME}=${HEADER_VAL}, baggage=${BAGGAGE_KEY}=${HEADER_VAL}"
          echo ""

          RESULT=$(fetch_originator "$URL")
          HTTP_CODE=$(cat /tmp/originator-http-code 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "404" ] || [ "$HTTP_CODE" = "000" ] \
            || echo "$RESULT" | grep -Eq '"error"[[:space:]]*:[[:space:]]*"unreachable"'; then
            URL="${BASE}/"
            echo "  /propagation unavailable (HTTP $HTTP_CODE) — retrying $URL"
            RESULT=$(fetch_originator "$URL")
          fi

          echo "Response:"
          echo "$RESULT" | jq '.' 2>/dev/null || echo "$RESULT"
          echo ""

          FAILED=0

          if echo "$RESULT" | grep -Eq '"error"[[:space:]]*:[[:space:]]*"unreachable"'; then
            echo "FAIL: originator unreachable — cannot prove hop-to-hop copy"
            FAILED=1
          fi

          HEADER_FOUND=false
          if [ -n "$HEADER_VAL" ] && printf '%s' "$RESULT" | grep -Fq "$HEADER_VAL"; then
            HEADER_FOUND=true
          fi

          REWRITTEN=false
          REWRITE_VALS=$(printf '%s' "$RESULT" | jq -r '
            .. | objects
            | (.session // .devSession // .headerValue // empty)
            | select(type=="string" and . != "")
          ' 2>/dev/null || true)
          if [ -n "$HEADER_VAL" ] && [ -n "$REWRITE_VALS" ]; then
            for SV in $REWRITE_VALS; do
              if [ "$SV" != "$HEADER_VAL" ]; then
                REWRITTEN=true
                echo "FAIL: original override '$HEADER_VAL' was rewritten to '$SV'"
                FAILED=1
              fi
            done
          fi

          if [ -n "$HEADER_VAL" ] && ! $HEADER_FOUND; then
            echo "FAIL: original override '$HEADER_VAL' missing from response"
            FAILED=1
          fi

          echo "Hop-by-hop verification (fail-closed):"
          HOP=0
          for APP in $CHAIN; do
            HOP=$((HOP + 1))
            PROP_ROLE=$(echo "$STACK_JSON" | jq -r --arg a "$APP" \
              '.apps[]|select(.name==$a)|."propagation-role" // "unknown"')

            IS_INTERCEPTED=false
            for BA in $BUILD_APPS; do
              [ "$BA" = "$APP" ] && IS_INTERCEPTED=true
            done

            MARKER=""
            $IS_INTERCEPTED && MARKER=" [INTERCEPTED]"

            REPO_BASE=$(echo "$STACK_JSON" | jq -r --arg a "$APP" \
              '.apps[]|select(.name==$a)|.repo // ""' | awk -F/ '{print $NF}')
            REACHED=false
            echo "$RESULT" | grep -qi "$APP" && REACHED=true
            if [ -n "$REPO_BASE" ]; then
              echo "$RESULT" | grep -qi "$REPO_BASE" && REACHED=true
            fi

            HOP_SESSION=$(printf '%s' "$RESULT" | jq -r --arg a "$APP" '
              [.. | objects | select((.app // .name // .service // "") | ascii_downcase | contains($a | ascii_downcase))]
              | map(.session // .devSession // .headerValue // empty)
              | map(select(. != ""))
              | first // empty
            ' 2>/dev/null || true)

            HEADER_REQUIRED=true
            if [ $HOP -gt $DEEPEST_INTERCEPT_POS ] && [ $DEEPEST_INTERCEPT_POS -gt 0 ]; then
              HEADER_REQUIRED=false
            fi

            if ! $HEADER_REQUIRED; then
              echo "  HOP $HOP $APP ($PROP_ROLE): OK (beyond intercept — original override not required)"
            elif ! $REACHED; then
              echo "  HOP $HOP $APP ($PROP_ROLE)${MARKER}: FAIL — NOT REACHED (header required at this hop)"
              FAILED=1
            elif [ -n "$HOP_SESSION" ] && [ -n "$HEADER_VAL" ] && [ "$HOP_SESSION" != "$HEADER_VAL" ]; then
              echo "  HOP $HOP $APP ($PROP_ROLE)${MARKER}: FAIL — rewritten session='$HOP_SESSION' (expected '$HEADER_VAL')"
              FAILED=1
            elif [ -n "$HEADER_VAL" ] && ! $HEADER_FOUND && [ -z "$HOP_SESSION" ]; then
              echo "  HOP $HOP $APP ($PROP_ROLE)${MARKER}: FAIL — original override not confirmed"
              FAILED=1
            else
              echo "  HOP $HOP $APP ($PROP_ROLE)${MARKER}: PASS — REACHED session=${HOP_SESSION:-$HEADER_VAL}"
            fi
          done

          echo ""
          if [ "$FAILED" -ne 0 ]; then
            echo "FAIL: original override was not transferred hop-to-hop"
            exit 1
          fi
          if $HEADER_FOUND; then
            echo "PASS: original override '$HEADER_VAL' transferred hop-to-hop"
          else
            echo "PASS: hop-to-hop verification complete"
          fi
          echo ""

          # ------------------------------------------------------------------
          # Routing proof (fail-closed). The /propagation echo above is served
          # identically by the baseline and the PR pod, so it cannot tell which
          # pod answered. Prove it from the PR pod's own access log: a request
          # tagged with a unique query string and carrying the header must show
          # up there; an untagged-header request with a different tag must not.
          # ------------------------------------------------------------------
          DEPLOYED_PODS='{
            "demo-fe": "pr-demo-fe-1790565353"
          }
          '
          if [ -n "$HEADER_VAL" ] && [ -n "$BUILD_APPS" ] \
            && [ -n "$DEPLOYED_PODS" ] && [ "$DEPLOYED_PODS" != "{}" ]; then
            echo "Routing proof (fail-closed): PR pod must serve matched traffic only"
            SA_DIR=/var/run/secrets/kubernetes.io/serviceaccount
            API="https://kubernetes.default.svc"
            pod_log() {
              # $1 namespace, $2 pod. Prefer the app container; fall back to the
              # pod default if that container name does not exist.
              out=$(curl -s --cacert "$SA_DIR/ca.crt" \
                -H "Authorization: Bearer $(cat "$SA_DIR/token")" \
                "$API/api/v1/namespaces/$1/pods/$2/log?container=pr-component&sinceSeconds=600" || true)
              if printf '%s' "$out" | grep -q '"kind":"Status"'; then
                out=$(curl -s --cacert "$SA_DIR/ca.crt" \
                  -H "Authorization: Bearer $(cat "$SA_DIR/token")" \
                  "$API/api/v1/namespaces/$1/pods/$2/log?sinceSeconds=600" || true)
              fi
              printf '%s' "$out"
            }
            for APP in $BUILD_APPS; do
              POD=$(echo "$DEPLOYED_PODS" | jq -r --arg a "$APP" '.[$a] // empty')
              if [ -z "$POD" ]; then
                echo "  $APP: FAIL — no PR pod recorded in deployed-pods"
                FAILED=1
                continue
              fi
              NS=$(echo "$STACK_JSON" | jq -r --arg a "$APP" --arg d "$DEFAULT_NS" \
                '(.defaults.namespace // $d) as $dn | .apps[]|select(.name==$a)|.namespace // $dn')
              SPORT=$(echo "$STACK_JSON" | jq -r --arg a "$APP" \
                '(.defaults."service-port" // "80") as $dp | .apps[]|select(.name==$a)|."service-port" // $dp')
              SVC="http://${APP}.${NS}.svc.cluster.local:${SPORT}"
              TAG=$(cat /dev/urandom | tr -dc 'a-z0-9' | head -c 12)
              HIT="probehit${TAG}"
              MISS="probemiss${TAG}"

              HIT_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                -H "${HEADER_NAME}: ${HEADER_VAL}" \
                -H "baggage: ${BAGGAGE_KEY}=${HEADER_VAL}" \
                --connect-timeout 10 --max-time 30 \
                "${SVC}/propagation?${HIT}" 2>/dev/null || echo "000")
              MISS_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                --connect-timeout 10 --max-time 30 \
                "${SVC}/propagation?${MISS}" 2>/dev/null || echo "000")
              echo "  $APP -> $POD: matched request HTTP $HIT_CODE, unmatched request HTTP $MISS_CODE"

              LOG=""
              ATTEMPT=0
              while [ $ATTEMPT -lt 10 ]; do
                ATTEMPT=$((ATTEMPT + 1))
                LOG=$(pod_log "$NS" "$POD")
                if printf '%s' "$LOG" | grep -q "$HIT"; then break; fi
                sleep 2
              done

              if ! printf '%s' "$LOG" | grep -q "$HIT"; then
                echo "  $APP: FAIL — header-matched request never reached PR pod $POD (intercept is not routing)"
                echo "  --- last 20 log lines of $POD ---"
                printf '%s\n' "$LOG" | tail -n 20 | sed 's/^/    /'
                FAILED=1
              elif printf '%s' "$LOG" | grep -q "$MISS"; then
                echo "  $APP: FAIL — unmatched request also reached PR pod $POD (intercept steals all traffic)"
                FAILED=1
              else
                echo "  $APP: PASS — PR pod $POD served the matched request and not the unmatched one"
              fi
            done
            echo ""
            if [ "$FAILED" -ne 0 ]; then
              echo "FAIL: intercept routing not proven"
              exit 1
            fi
            echo "PASS: intercept routing proven from PR pod access logs"
            echo ""
          elif [ -n "$BUILD_APPS" ]; then
            echo "Routing proof skipped: deployed-pods not provided"
            echo ""
          fi

          echo "Propagation validation complete."
kind: List
metadata:
  resourceVersion: ""
