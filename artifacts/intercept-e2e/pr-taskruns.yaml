        - name: STACK_JSON
          value: |
            {"name":"stack-one","description":"Demo 3-tier stack: Frontend (Vue) → BFF middleware (Spring Boot) → REST API persistence (Spring Boot)","propagation":{"header-name":"x-dev-session","baggage-key":"dev-session","strategy":"w3c-baggage"},"defaults":{"namespace":"staging","image-registry":"${IMAGE_REGISTRY}","service-port":"80","container-port":"8080"},"apps":[{"name":"demo-fe","repo":"jmjava/tekton-dag-vue-fe","role":"frontend","propagation-role":"originator","namespace":null,"container-port":"80","service-port":null,"context-dir":".","dockerfile":"Dockerfile","build":{"tool":"npm","runtime":"vue","node-version":"22","build-command":"npm install && npm run build"},"downstream":["release-lifecycle-demo"],"tests":{"postman":"tests/postman/fe-tests.json","playwright":"tests/playwright","artillery":"tests/artillery/load-test.yml"}},{"name":"release-lifecycle-demo","repo":"jmjava/tekton-dag-spring-boot","role":"middleware","propagation-role":"forwarder","namespace":null,"container-port":null,"service-port":null,"context-dir":".","dockerfile":"Dockerfile","build":{"tool":"maven","runtime":"spring-boot","java-version":"21","build-command":"mvn -B clean package -DskipTests"},"downstream":["demo-api"],"tests":{"postman":"tests/postman/bff-tests.json"}},{"name":"demo-api","repo":"jmjava/tekton-dag-spring-boot-gradle","role":"persistence","propagation-role":"terminal","namespace":null,"container-port":null,"service-port":null,"context-dir":".","dockerfile":"Dockerfile","build":{"tool":"maven","runtime":"spring-boot","java-version":"21","build-command":"mvn -B clean package -DskipTests"},"downstream":[],"tests":{"postman":"tests/postman/api-tests.json"}}]}
        - name: COMPILE_IMAGE
          value: ubuntu:22.04
        image: ubuntu:22.04
        name: compile-npm
        script: |
          #!/usr/bin/env bash
          set -e
          if [ "$COMPILE_IMAGE" = "ubuntu:22.04" ]; then apt-get update -qq && apt-get install -y -qq curl jq ca-certificates gnupg >/dev/null 2>&1; fi
          [ "true" = "true" ] && CACHE="/workspace/build-cache" && mkdir -p "$CACHE/.npm" && export npm_config_cache="$CACHE/.npm"
          APPS=$(jq -r '.npm[]' .tool-apps.json 2>/dev/null || true)
          [ -z "$APPS" ] && echo "No npm apps" && exit 0
          if [ "$COMPILE_IMAGE" = "ubuntu:22.04" ]; then
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash - >/dev/null 2>&1 && apt-get install -y -qq nodejs >/dev/null 2>&1
          fi
          for APP in $APPS; do
            echo "=== Compile (npm): $APP ==="
            CMD=$(echo "$STACK_JSON" | jq -r --arg a "$APP" '.apps[]|select(.name==$a)|.build."build-command" // ""')
            PRE_CMD=$(echo "$STACK_JSON" | jq -r --arg a "$APP" '.apps[]|select(.name==$a)|.build."pre-command" // ""')
            POST_CMD=$(echo "$STACK_JSON" | jq -r --arg a "$APP" '.apps[]|select(.name==$a)|.build."post-command" // ""')
            CONTEXT=$(echo "$STACK_JSON" | jq -r --arg a "$APP" '.apps[]|select(.name==$a)|."context-dir" // "."')
            APP_DIR="/workspace/source"; [ -d "/workspace/source/${APP}" ] && APP_DIR="/workspace/source/${APP}"
            [ "$CONTEXT" != "." ] && [ -d "${APP_DIR}/${CONTEXT}" ] && APP_DIR="${APP_DIR}/${CONTEXT}"
            for k in $(echo "$STACK_JSON" | jq -r --arg a "$APP" '.apps[]|select(.name==$a)|.build.env // {} | keys[]' 2>/dev/null); do v=$(echo "$STACK_JSON" | jq -r --arg a "$APP" --arg k "$k" '.apps[]|select(.name==$a)|.build.env[$k] // ""'); [ -n "$k" ] && export "$k=$v"; done
            for k in $(echo "$STACK_JSON" | jq -r --arg a "$APP" '.apps[]|select(.name==$a)|.build.legacy // {} | keys[]' 2>/dev/null); do v=$(echo "$STACK_JSON" | jq -r --arg a "$APP" --arg k "$k" '.apps[]|select(.name==$a)|.build.legacy[$k] // ""'); [ -n "$k" ] && export "$k=$v"; done
            cd "$APP_DIR"
            [ -n "$PRE_CMD" ] && eval "$PRE_CMD"
            if [ -n "$CMD" ]; then
              RUN_CMD="$CMD"; echo "$CMD" | grep -q "npm ci" && [ ! -f package-lock.json ] && RUN_CMD=$(echo "$CMD" | sed 's/npm ci/npm install/g')
              eval "$RUN_CMD"
            else
              [ -f package-lock.json ] && npm ci || npm install; npm run build --if-present
            fi
            [ -n "$POST_CMD" ] && eval "$POST_CMD"
          done
          echo "Compile (npm) done."
        workingDir: /workspace/source
      workspaces:
      - name: source
      - name: build-cache
        optional: true
