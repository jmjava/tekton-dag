              optional: true
        - name: GIT_URL
          value: https://github.com/jmjava/tekton-dag.git
        - name: PR_REPO_URL
        - name: PR_NUMBER
          value: "903"
        - name: RUN_NAME
          value: stackrun-pr-27exw
        - name: NAMESPACE
          value: tekton-pipelines
        - name: STATUS
          value: Completed
        - name: TEST_SUMMARY
          value: |
            {
