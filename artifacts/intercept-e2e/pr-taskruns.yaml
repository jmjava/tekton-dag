    taskSpec:
      description: |
        Runs Kaniko to build and push images for build-apps. M7.1: builds all apps in parallel by spawning one Kaniko pod per app (each mounts the shared PVC). Supports Kaniko layer cache via cache-repo param.
      params:
      - name: stack-json
        type: string
      - name: build-apps
        type: string
      - name: image-registry
        type: string
      - name: image-tag
        type: string
      - default: pr-
