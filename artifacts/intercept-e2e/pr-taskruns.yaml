    taskSpec:
      description: |
        Reads a stack definition and the version registry from the workspace, merges in any version overrides, computes topological build order, and emits structured JSON results that downstream tasks consume.
      params:
      - description: Path to the stack YAML relative to workspace root
        name: stack-file
        type: string
      - default: stacks/versions.yaml
        description: Path to versions.yaml relative to workspace root
        name: versions-file
        type: string
      - default: '{}'
        description: |
          JSON map of app-name → version to override the registry defaults. Example: {"demo-fe":"0.2.0","demo-api":"0.1.5"} Pass {} to use whatever versions.yaml has.
        name: version-overrides
        type: string
      - default: ""
        description: App whose PR triggered this run (empty = build all)
        name: changed-app
        type: string
      - default: ""
        description: PR number for intercept-header generation
        name: pr-number
        type: string
      results:
      - description: Full stack graph as JSON (includes build config per app)
        name: stack-json
        type: string
      - description: Space-separated list of apps in topological order
        name: app-list
        type: string
      - description: Entry-point app (typically the frontend)
        name: entry-app
        type: string
      - description: Ordered chain of apps for header propagation validation
        name: propagation-chain
        type: string
      - description: Header value to use for Telepresence intercepts
        name: intercept-header-value
        type: string
      - description: Space-separated list of apps to build (changed-app or all)
        name: build-apps
        type: string
      - description: true if any build-app uses npm (so only that compile step runs)
        name: run-compile-npm
        type: string
      - description: true if any build-app uses maven
        name: run-compile-maven
        type: string
      - description: true if any build-app uses gradle
        name: run-compile-gradle
        type: string
      - description: true if any build-app uses pip
        name: run-compile-pip
        type: string
      - description: true if any build-app uses composer
        name: run-compile-composer
        type: string
      - description: JSON map of app → version (registry defaults merged with overrides)
        name: resolved-versions
        type: string
      steps:
      - computeResources: {}
        env:
        - name: YQ_VERSION
          value: v4.45.4
        - name: JQ_VERSION
          value: jq-1.7.1
        image: alpine:3.21
        name: resolve
        script: |
          #!/bin/sh
          set -eu

          arch=$(uname -m)
          case "$arch" in
            x86_64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "ERROR: unsupported arch $arch" >&2; exit 1 ;;
          esac
          install_static() {
            dest="$1"
            url="$2"
            wget -q -O "$dest" "$url"
            chmod +x "$dest"
          }
          # Prefer distro packages; fall back to GitHub (reachable in Kind/GHA).
          if ! apk add --no-cache jq yq-go; then
            echo "apk add jq/yq-go failed; installing static binaries from GitHub" >&2
            install_static /usr/local/bin/jq "https://github.com/jqlang/jq/releases/download/${JQ_VERSION}/jq-linux-${arch}"
            install_static /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_${arch}"
          fi
          command -v jq >/dev/null || { echo "ERROR: jq is required" >&2; exit 1; }
          command -v yq >/dev/null || { echo "ERROR: yq is required" >&2; exit 1; }

          STACK="stacks/stack-one.yaml"
          VFILE="stacks/versions.yaml"
          OVERRIDES='{}'
          CHANGED="demo-fe"
          PR="903"

          if [ ! -f "$STACK" ]; then
            echo "ERROR: stack file not found: $STACK (cwd=$(pwd))" >&2
            ls -la >&2
            ls -la stacks >&2 || true
            exit 1
          fi

          STACK_JSON=$(yq -o=json "$STACK")

          # ----------------------------------------------------------
          # Build the full graph JSON (preserves build config per app)
          # ----------------------------------------------------------
          echo "$STACK_JSON" | jq -c '{
            name:        .name,
            description: .description,
            propagation: .propagation,
            defaults:    .defaults,
            apps:        [.apps[] | {
              name:               .name,
              repo:               .repo,
              role:               .role,
              "propagation-role": (."propagation-role" // (if .downstream == [] or .downstream == null then "terminal" elif (.role == "frontend") then "originator" else "forwarder" end)),
              namespace:          (.namespace // null),
              "container-port":   (."container-port" // null),
              "service-port":     (."service-port" // null),
              "context-dir":      (."context-dir" // "."),
              dockerfile:         (.dockerfile // "Dockerfile"),
              build:              (.build // {tool:"none", runtime:"custom"}),
              downstream:         (.downstream // []),
              tests:              (.tests // {})
            }]
          }' > /tmp/stack.json

          cat /tmp/stack.json | tee /tekton/results/stack-json

          # ----------------------------------------------------------
          # Resolve versions: registry defaults + overrides
          # ----------------------------------------------------------
          VERSIONS_JSON="{}"
          if [ -f "$VFILE" ]; then
            VERSIONS_JSON=$(yq -o=json '.apps' "$VFILE" | jq '
              [to_entries[] | {key: .key, value: .value.version}] | from_entries
            ')
          fi

          # Only keep versions for apps actually in this stack
          APP_NAMES=$(cat /tmp/stack.json | jq -r '.apps[].name')
          STACK_VERSIONS="{}"
          for APP in $APP_NAMES; do
            VER=$(echo "$VERSIONS_JSON" | jq -r --arg a "$APP" '.[$a] // "0.1.0-rc.0"')
            STACK_VERSIONS=$(echo "$STACK_VERSIONS" | jq --arg a "$APP" --arg v "$VER" '. + {($a): $v}')
          done

          # Merge overrides on top
          if [ "$OVERRIDES" != "{}" ] && [ -n "$OVERRIDES" ]; then
            echo "Applying version overrides: $OVERRIDES"
            STACK_VERSIONS=$(echo "$STACK_VERSIONS" | jq --argjson ov "$OVERRIDES" '. * $ov')
          fi

          echo "Resolved versions:"
          echo "$STACK_VERSIONS" | jq '.'
          echo -n "$STACK_VERSIONS" | jq -c '.' | tee /tekton/results/resolved-versions
          echo ""

          # ----------------------------------------------------------
          # Topological order
          # ----------------------------------------------------------
          TOPO=$(cat /tmp/stack.json | jq -r '
            def vis($n;$adj):
              if (.t|index($n)) then .err=true
              elif (.v|index($n)) then .
              else .t+=[$n] |
                reduce ($adj[$n]//[])[] as $d (.;vis($d;$adj)) |
                .t-=[$n] | .v+=[$n] | .o+=[$n]
              end;
            def topo:
              . as $g |
              ($g.apps | map({key:.name, value:.downstream}) | from_entries) as $adj |
              ($g.apps | map(.name)) as $all |
              {v:[],t:[],o:[],err:false} |
              reduce $all[] as $n (.;
                if (.v|index($n)) then . else .|vis($n;$adj) end
              ) |
              if .err then error("cycle") else .o|reverse end;
            topo | join(" ")
          ')
          echo -n "$TOPO" | tee /tekton/results/app-list
          echo ""

          # ----------------------------------------------------------
          # Entry point (app that no other app lists as downstream)
          # ----------------------------------------------------------
          ENTRY=$(cat /tmp/stack.json | jq -r '
            (.apps|map(.downstream)|flatten) as $deps |
            .apps[] | select(.name as $n | ($deps|index($n))|not) | .name
          ' | head -1)
          echo -n "$ENTRY" | tee /tekton/results/entry-app
          echo ""

          # ----------------------------------------------------------
          # Propagation chain from entry
          # ----------------------------------------------------------
          cat /tmp/stack.json | jq -r --arg s "$ENTRY" '
            def walk($name):
              . as $g |
              ($g.apps[]|select(.name==$name)) as $app |
              if $app then [$name] + reduce ($app.downstream//[])[] as $d
                ([]; . + ($g|walk($d)))
              else [] end;
            walk($s) | join(" ")
          ' | tee /tekton/results/propagation-chain

          # ----------------------------------------------------------
          # Intercept header
          # ----------------------------------------------------------
          if [ -n "$PR" ]; then
            HEADER_NAME=$(echo "$STACK_JSON" | jq -r '.propagation."header-name" // "x-dev-session"')
            echo -n "${HEADER_NAME}:pr-${PR}" | tee /tekton/results/intercept-header-value
          else
            echo -n "" | tee /tekton/results/intercept-header-value
          fi
          echo ""

          # ----------------------------------------------------------
          # Build list
          # ----------------------------------------------------------
          if [ -n "$CHANGED" ]; then
            echo -n "$CHANGED" | tee /tekton/results/build-apps
          else
            echo -n "$TOPO" | tee /tekton/results/build-apps
          fi
          echo ""

          # ----------------------------------------------------------
          # Which compile steps to run (only tools used by build-apps)
          # ----------------------------------------------------------
          BUILD_APPS=$(cat /tekton/results/build-apps)
          RUN_NPM="false"; RUN_MAVEN="false"; RUN_GRADLE="false"; RUN_PIP="false"; RUN_COMPOSER="false"
          for app in $BUILD_APPS; do
            tool=$(cat /tmp/stack.json | jq -r --arg a "$app" '.apps[]|select(.name==$a)|.build.tool // "none"')
            case "$tool" in
              npm)     RUN_NPM="true" ;;
              maven)   RUN_MAVEN="true" ;;
              gradle)  RUN_GRADLE="true" ;;
              pip)     RUN_PIP="true" ;;
              composer) RUN_COMPOSER="true" ;;
            esac
          done
          echo -n "$RUN_NPM" | tee /tekton/results/run-compile-npm
          echo -n "$RUN_MAVEN" | tee /tekton/results/run-compile-maven
          echo -n "$RUN_GRADLE" | tee /tekton/results/run-compile-gradle
          echo -n "$RUN_PIP" | tee /tekton/results/run-compile-pip
          echo -n "$RUN_COMPOSER" | tee /tekton/results/run-compile-composer
          echo ""
        securityContext:
          runAsUser: 0
        workingDir: /workspace/source
      workspaces:
      - name: source
