        description: Kaniko cache repo (e.g. localhost:5000/kaniko-cache). Empty disables
          cache.
        name: cache-repo
        type: string
      - default: "0"
        description: Max Kaniko pods to run concurrently. 0 = unlimited (all at once).
        name: max-parallel-builds
        type: string
      results:
      - description: JSON map of app-name → full image URI
        name: built-images
        type: string
      steps:
      - computeResources: {}
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: bitnami/kubectl:latest
        name: containerize
        script: |
          #!/bin/bash
          set -e

          STACK_JSON='{"name":"stack-one","description":"Demo 3-tier stack: Frontend (Vue) → BFF middleware (Spring Boot) → REST API persistence (Spring Boot)","propagation":{"header-name":"x-dev-session","baggage-key":"dev-session","strategy":"w3c-baggage"},"defaults":{"namespace":"staging","image-registry":"${IMAGE_REGISTRY}","service-port":"80","container-port":"8080"},"apps":[{"name":"demo-fe","repo":"jmjava/tekton-dag-vue-fe","role":"frontend","propagation-role":"originator","namespace":null,"container-port":"80","service-port":null,"context-dir":".","dockerfile":"Dockerfile","build":{"tool":"npm","runtime":"vue","node-version":"22","build-command":"npm install && npm run build"},"downstream":["release-lifecycle-demo"],"tests":{"postman":"tests/postman/fe-tests.json","playwright":"tests/playwright","artillery":"tests/artillery/load-test.yml"}},{"name":"release-lifecycle-demo","repo":"jmjava/tekton-dag-spring-boot","role":"middleware","propagation-role":"forwarder","namespace":null,"container-port":null,"service-port":null,"context-dir":".","dockerfile":"Dockerfile","build":{"tool":"maven","runtime":"spring-boot","java-version":"21","build-command":"mvn -B clean package -DskipTests"},"downstream":["demo-api"],"tests":{"postman":"tests/postman/bff-tests.json"}},{"name":"demo-api","repo":"jmjava/tekton-dag-spring-boot-gradle","role":"persistence","propagation-role":"terminal","namespace":null,"container-port":null,"service-port":null,"context-dir":".","dockerfile":"Dockerfile","build":{"tool":"maven","runtime":"spring-boot","java-version":"21","build-command":"mvn -B clean package -DskipTests"},"downstream":[],"tests":{"postman":"tests/postman/api-tests.json"}}]}
          '
          BUILD_APPS="demo-fe"
          REGISTRY="localhost:5000"
          IMAGE_TAG='{"demo-fe":"stackrun-pr-27exw"}'
          TAG_PREFIX=""
          CACHE_REPO=""
          MAX_PARALLEL="0"
          SOURCE_PVC="pvc-c91a6da3ac"
          SOURCE_PATH="/workspace/source"
          NS="$POD_NAMESPACE"

          PUSH_REGISTRY=$(echo "$REGISTRY" | sed 's|localhost:|kind-registry:|')
          PUSH_CACHE=""
          if [ -n "$CACHE_REPO" ]; then
            PUSH_CACHE=$(echo "$CACHE_REPO" | sed 's|localhost:|kind-registry:|')
          fi

          if [ -z "$SOURCE_PVC" ]; then
            echo "ERROR: source workspace must be PVC-backed for parallel containerize" >&2
            exit 1
          fi

          IS_JSON=false
          case "$IMAGE_TAG" in *"{"*) IS_JSON=true ;; esac

          TS=$(date +%s)

          echo "============================================="
          echo "  Parallel Containerize (Kaniko pods)"
          echo "============================================="
          echo "  Apps:  $BUILD_APPS"
          echo "  PVC:   $SOURCE_PVC"
          echo "  Cache: ${CACHE_REPO:-disabled}"
          echo "  Max parallel: ${MAX_PARALLEL:-0 (unlimited)}"
          echo ""

          > /tmp/pod-list.txt
          > /tmp/app-images.txt
          > /tmp/batch-pods.txt
          BATCH_COUNT=0

          wait_for_batch() {
            local BATCH_FAILED=""
            while IFS= read -r P; do
              [ -z "$P" ] && continue
              echo "    Waiting: $P" >&2
              while true; do
                PH=$(kubectl get pod "$P" -n "$NS" -o jsonpath='{.status.phase}' 2>/dev/null || echo "Pending")
                case "$PH" in
                  Succeeded) echo "      $P: Succeeded" >&2; break ;;
                  Failed)    echo "      $P: FAILED" >&2; BATCH_FAILED="${BATCH_FAILED} ${P}"; break ;;
                  *)         sleep 5 ;;
                esac
              done
            done < /tmp/batch-pods.txt
            > /tmp/batch-pods.txt
            BATCH_COUNT=0
            echo "$BATCH_FAILED"
          }

          FAILED=""

          for APP in $BUILD_APPS; do
            echo "========================================="
            echo "  Containerize: $APP"
            echo "========================================="

            if $IS_JSON; then
              APP_VER=$(echo "$IMAGE_TAG" | sed 's/[{}" ]//g' | tr ',' '\n' | grep "^${APP}:" | cut -d: -f2)
              [ -z "$APP_VER" ] && APP_VER="latest"
              TAG="${TAG_PREFIX}${APP_VER}"
            else
              TAG="${TAG_PREFIX}${IMAGE_TAG}"
            fi

            CONTEXT_PATH="${SOURCE_PATH}/${APP}"
            FULL_DOCKERFILE="${CONTEXT_PATH}/Dockerfile"
            PUSH_IMAGE="${PUSH_REGISTRY}/${APP}:${TAG}"
            PULL_IMAGE="${REGISTRY}/${APP}:${TAG}"

            if [ ! -f "$FULL_DOCKERFILE" ] && [ ! -d "$CONTEXT_PATH" ]; then
              echo "  WARN: No Dockerfile at $FULL_DOCKERFILE — skipping"
              echo "${APP}=${PULL_IMAGE}" >> /tmp/app-images.txt
              continue
            fi

            KANIKO_ARGS="[\"--dockerfile=${FULL_DOCKERFILE}\",\"--context=${CONTEXT_PATH}\",\"--destination=${PUSH_IMAGE}\",\"--insecure\",\"--insecure-pull\",\"--ignore-path=/product_uuid\",\"--ignore-path=/sys\""
            if [ -n "$PUSH_CACHE" ]; then
              KANIKO_ARGS="${KANIKO_ARGS},\"--cache=true\",\"--cache-repo=${PUSH_CACHE}\",\"--cache-ttl=168h\""
            else
              KANIKO_ARGS="${KANIKO_ARGS},\"--cache=false\""
            fi
            KANIKO_ARGS="${KANIKO_ARGS}]"

            POD_NAME="kaniko-${APP}-${TS}"
            echo "  Launching: $POD_NAME"
            echo "  Push to:   $PUSH_IMAGE"
            echo "  Pull as:   $PULL_IMAGE"

            cat <<KPOD | kubectl apply -f - -n "$NS"
          apiVersion: v1
          kind: Pod
          metadata:
            name: ${POD_NAME}
            namespace: ${NS}
            labels:
              app: kaniko-build
              component: ${APP}
              managed-by: tekton-job-standardization
          spec:
            activeDeadlineSeconds: 600
            containers:
            - name: kaniko
              image: gcr.io/kaniko-project/executor:latest
              args: ${KANIKO_ARGS}
              volumeMounts:
              - name: source
                mountPath: ${SOURCE_PATH}
            volumes:
            - name: source
              persistentVolumeClaim:
                claimName: ${SOURCE_PVC}
            restartPolicy: Never
          KPOD

            echo "$POD_NAME" >> /tmp/pod-list.txt
            echo "$POD_NAME" >> /tmp/batch-pods.txt
            echo "${APP}=${PULL_IMAGE}" >> /tmp/app-images.txt
            BATCH_COUNT=$((BATCH_COUNT + 1))
            echo ""

            if [ "$MAX_PARALLEL" -gt 0 ] && [ "$BATCH_COUNT" -ge "$MAX_PARALLEL" ]; then
              echo "  --- Batch limit ($MAX_PARALLEL) reached, waiting for batch ---"
              BATCH_RESULT=$(wait_for_batch)
              [ -n "$BATCH_RESULT" ] && FAILED="${FAILED}${BATCH_RESULT}"
            fi
          done

          if [ -s /tmp/batch-pods.txt ]; then
            echo "  --- Waiting for final batch ---"
            BATCH_RESULT=$(wait_for_batch)
            [ -n "$BATCH_RESULT" ] && FAILED="${FAILED}${BATCH_RESULT}"
          fi

          echo ""
          echo "  Cleaning up Kaniko pods..."
          while IFS= read -r POD_NAME; do
            [ -z "$POD_NAME" ] && continue
            kubectl delete pod "$POD_NAME" -n "$NS" --ignore-not-found=true 2>/dev/null &
          done < /tmp/pod-list.txt
          wait

          if [ -n "$FAILED" ]; then
            echo "FAILED: Kaniko pods failed:$FAILED" >&2
            for P in $FAILED; do
              echo "--- Logs for $P ---"
              kubectl logs "$P" -n "$NS" --tail=30 2>/dev/null || true
            done
            exit 1
          fi

          > /tmp/parts.txt
          while IFS='=' read -r APP IMG; do
            [ -z "$APP" ] && continue
            echo "  \"${APP}\": \"${IMG}\"" >> /tmp/parts.txt
          done < /tmp/app-images.txt

          TOTAL=$(wc -l < /tmp/parts.txt)
          COUNT=0
          echo '{' > /tmp/built.json
          while IFS= read -r line; do
            COUNT=$((COUNT + 1))
            if [ "$COUNT" -lt "$TOTAL" ]; then
              echo "${line}," >> /tmp/built.json
            else
              echo "${line}" >> /tmp/built.json
            fi
          done < /tmp/parts.txt
          echo '}' >> /tmp/built.json

          echo ""
          echo "  Built images:"
          cat /tmp/built.json
          cat /tmp/built.json | tee /tekton/results/built-images
      workspaces:
      - name: source
