  pipelineSpec:
    description: |
      PR testing pipeline. Uses the currently running apps in the cluster and only builds/replaces the one app being tested (changed-app). Other apps are left as-is; mirrord intercepts route PR traffic only to the new build. Tests one app at a time (changed-app is required when invoking this pipeline). 1. Clones platform repo and resolves the stack graph 2. Clones and builds ONLY the changed app (snapshot tag) — no build of other apps 3. Deploys intercepts only for that app; rest of stack keeps running as-is 4. Validates header propagation, runs test suites 5. Posts a PR comment; does **not** bump `versions.yaml` (snapshot image tags only) 6. Cleans up PR pods (always) PR builds use snapshot tagging so they are never confused with real releases.
