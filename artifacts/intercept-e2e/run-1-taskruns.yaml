          STACK_JSON='{"name":"stack-one","description":"Demo 3-tier stack: Frontend (Vue) → BFF middleware (Spring Boot) → REST API persistence (Spring Boot)","propagation":{"header-name":"x-dev-session","baggage-key":"dev-session","strategy":"w3c-baggage"},"defaults":{"namespace":"staging","image-registry":"${IMAGE_REGISTRY}","service-port":"80","container-port":"8080"},"apps":[{"name":"demo-fe","repo":"jmjava/tekton-dag-vue-fe","role":"frontend","propagation-role":"originator","namespace":null,"container-port":"80","service-port":null,"context-dir":".","dockerfile":"Dockerfile","build":{"tool":"npm","runtime":"vue","node-version":"22","build-command":"npm install && npm run build"},"downstream":["release-lifecycle-demo"],"tests":{"postman":"tests/postman/fe-tests.json","playwright":"tests/playwright","artillery":"tests/artillery/load-test.yml"}},{"name":"release-lifecycle-demo","repo":"jmjava/tekton-dag-spring-boot","role":"middleware","propagation-role":"forwarder","namespace":null,"container-port":null,"service-port":null,"context-dir":".","dockerfile":"Dockerfile","build":{"tool":"maven","runtime":"spring-boot","java-version":"21","build-command":"mvn -B clean package -DskipTests"},"downstream":["demo-api"],"tests":{"postman":"tests/postman/bff-tests.json"}},{"name":"demo-api","repo":"jmjava/tekton-dag-spring-boot-gradle","role":"persistence","propagation-role":"terminal","namespace":null,"container-port":null,"service-port":null,"context-dir":".","dockerfile":"Dockerfile","build":{"tool":"maven","runtime":"spring-boot","java-version":"21","build-command":"mvn -B clean package -DskipTests"},"downstream":[],"tests":{"postman":"tests/postman/api-tests.json"}}]}
          '
          BUILD_APPS="demo-fe release-lifecycle-demo demo-api"
          DEFAULT_REVISION="main"
          APP_REVISIONS='{}'
          WORKSPACE="/workspace/source"

          # Clear existing app dirs so we get a fresh clone (no stale/cached content)
          echo "  Clearing existing app dirs..."
          for APP in $BUILD_APPS; do
            rm -rf "$WORKSPACE/$APP"
          done

          # Prefer authenticated SSH when a key is present. Public repositories
          # can be cloned over HTTPS from an empty Secret workspace.
          mkdir -p /root/.ssh
          chmod 700 /root/.ssh
          KEY_DIR="/workspace/ssh-key"
          CLONE_TRANSPORT=https
          if [ -f "$KEY_DIR/id_ed25519" ]; then
            cp "$KEY_DIR/id_ed25519" /root/.ssh/id_ed25519
            chmod 600 /root/.ssh/id_ed25519
            CLONE_TRANSPORT=ssh
          elif [ -f "$KEY_DIR/id_rsa" ]; then
            cp "$KEY_DIR/id_rsa" /root/.ssh/id_rsa
            chmod 600 /root/.ssh/id_rsa
            CLONE_TRANSPORT=ssh
          else
            echo "  No SSH key found; cloning public repositories over HTTPS"
          fi
          if [ "$CLONE_TRANSPORT" = "ssh" ]; then
            ssh-keyscan -H github.com >> /root/.ssh/known_hosts 2>/dev/null || true
          fi

          # Clone all app repos in parallel (M7.1)
          clone_app() {
            local APP="$1" REPO="$2" REVISION="$3" URL="$4"
            echo "  Cloning $APP from $URL (revision: $REVISION) -> $WORKSPACE/$APP"
            git clone --depth 1 "$URL" "$WORKSPACE/$APP" 2>&1 | sed "s/^/  [$APP] /"
            if ! git -C "$WORKSPACE/$APP" fetch --depth 1 origin "$REVISION"; then
              echo "ERROR: could not fetch $REVISION for $APP" >&2
              exit 1
            fi
            git -C "$WORKSPACE/$APP" checkout --detach FETCH_HEAD
            echo "  [$APP] at $(git -C "$WORKSPACE/$APP" rev-parse --short HEAD) ($REVISION)"
            echo "  Done: $APP"
          }

          PIDS=""
          for APP in $BUILD_APPS; do
            REPO=$(echo "$STACK_JSON" | jq -r --arg a "$APP" '.apps[]|select(.name==$a)|.repo')
            if [ -z "$REPO" ] || [ "$REPO" = "null" ]; then
              echo "  WARN: No repo for app $APP in stack, skipping"
              continue
            fi
            REVISION=$(echo "$APP_REVISIONS" | jq -r --arg a "$APP" '.[$a] // empty')
            [ -z "$REVISION" ] && REVISION="$DEFAULT_REVISION"
            if [ "$CLONE_TRANSPORT" = "ssh" ]; then
              URL="git@github.com:${REPO}.git"
            else
              URL="https://github.com/${REPO}.git"
            fi
            clone_app "$APP" "$REPO" "$REVISION" "$URL" &
            PIDS="$PIDS $!"
          done

          CLONE_FAILED=false
          for PID in $PIDS; do
            if ! wait "$PID"; then
              CLONE_FAILED=true
            fi
          done
          if [ "$CLONE_FAILED" = "true" ]; then
            echo "ERROR: One or more clones failed" >&2
            exit 1
          fi

          echo ""
          echo "App repos cloned (parallel). Listing:"
          for APP in $BUILD_APPS; do
            [ -d "$WORKSPACE/$APP" ] && echo "  $WORKSPACE/$APP" || true
          done
        workingDir: /workspace/source
      workspaces:
      - description: Workspace with platform repo at root; app repos will be cloned
          into source/<app-name>
        name: source
      - description: Volume that may contain id_ed25519 or id_rsa for private-repository
          SSH clones
        name: ssh-key
