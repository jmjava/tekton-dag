    taskSpec:
      description: |
        Deploys the full stack so every app has a Deployment and Service in the cluster. Used once (bootstrap) before running PR pipeline with intercepts. deploy-stack-intercepts expects these Services to exist; it only adds PR pods + Telepresence intercept for changed app(s). M13: injects stack secrets/config blocks as envFrom and volume mounts; fails fast when referenced Secrets are missing. Also injects BAGGAGE_* / APP_NAME / DOWNSTREAM_URL so install() copies the original override header hop-to-hop without a hand-written env block.
      params:
      - description: Full stack graph JSON (apps, defaults.namespace, ports, secrets,
          config)
        name: stack-json
        type: string
      - description: JSON map of app name → image URI
        name: built-images
