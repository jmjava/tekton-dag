      steps:
      - computeResources: {}
        image: bitnami/kubectl:latest
        name: deploy
        script: |
          #!/bin/bash
          set -euo pipefail
          STACK_JSON='{"name":"stack-one","description":"Demo 3-tier stack: Frontend (Vue) → BFF middleware (Spring Boot) → REST API persistence (Spring Boot)","propagation":{"header-name":"x-dev-session","baggage-key":"dev-session","strategy":"w3c-baggage"},"defaults":{"namespace":"staging","image-registry":"${IMAGE_REGISTRY}","service-port":"80","container-port":"8080"},"apps":[{"name":"demo-fe","repo":"jmjava/tekton-dag-vue-fe","role":"frontend","propagation-role":"originator","namespace":null,"container-port":"80","service-port":null,"context-dir":".","dockerfile":"Dockerfile","build":{"tool":"npm","runtime":"vue","node-version":"22","build-command":"npm install && npm run build"},"downstream":["release-lifecycle-demo"],"tests":{"postman":"tests/postman/fe-tests.json","playwright":"tests/playwright","artillery":"tests/artillery/load-test.yml"}},{"name":"release-lifecycle-demo","repo":"jmjava/tekton-dag-spring-boot","role":"middleware","propagation-role":"forwarder","namespace":null,"container-port":null,"service-port":null,"context-dir":".","dockerfile":"Dockerfile","build":{"tool":"maven","runtime":"spring-boot","java-version":"21","build-command":"mvn -B clean package -DskipTests"},"downstream":["demo-api"],"tests":{"postman":"tests/postman/bff-tests.json"}},{"name":"demo-api","repo":"jmjava/tekton-dag-spring-boot-gradle","role":"persistence","propagation-role":"terminal","namespace":null,"container-port":null,"service-port":null,"context-dir":".","dockerfile":"Dockerfile","build":{"tool":"maven","runtime":"spring-boot","java-version":"21","build-command":"mvn -B clean package -DskipTests"},"downstream":[],"tests":{"postman":"tests/postman/api-tests.json"}}]}
          '
          BUILT='{
            "demo-fe": "localhost:5000/demo-fe:base-1",
            "release-lifecycle-demo": "localhost:5000/release-lifecycle-demo:base-1",
            "demo-api": "localhost:5000/demo-api:base-1"
          }
          '
          DEFAULT_NS="staging"
          VALIDATE_SECRETS="true"

          echo "============================================="
          echo "  Deploy full stack (base for intercept E2E)"
          echo "============================================="

          for APP in $(echo "$STACK_JSON" | jq -r '.apps[].name'); do
            IMAGE=$(echo "$BUILT" | jq -r --arg a "$APP" '.[$a]')
            if [ -z "$IMAGE" ] || [ "$IMAGE" = "null" ]; then
              echo "  SKIP $APP: no image in built-images"
              continue
            fi
            NS=$(echo "$STACK_JSON" | jq -r --arg a "$APP" --arg d "$DEFAULT_NS" \
              '(.defaults.namespace // $d) as $dn | .apps[]|select(.name==$a)|.namespace // $dn')
            CPORT=$(echo "$STACK_JSON" | jq -r --arg a "$APP" \
              '(.defaults."container-port" // "8080") as $dp | .apps[]|select(.name==$a)|."container-port" // $dp')
            SPORT=$(echo "$STACK_JSON" | jq -r --arg a "$APP" \
              '(.defaults."service-port" // "80") as $dp | .apps[]|select(.name==$a)|."service-port" // $dp')

            # Pre-deploy Secret + ConfigMap validation (M13)
            if [ "$VALIDATE_SECRETS" = "true" ]; then
              MISSING_SECRETS=$(echo "$STACK_JSON" | jq -r --arg a "$APP" '
                .apps[] | select(.name==$a) |
                [(.secrets."env-from" // [])[], ((.secrets."volume-mounts" // [])[]?.secret // empty)] |
                unique | .[]
              ')
              for S in $MISSING_SECRETS; do
                if ! kubectl get secret "$S" -n "$NS" >/dev/null 2>&1; then
                  echo "ERROR: app $APP references Secret '$S' which is missing in namespace $NS"
                  exit 1
                fi
              done
              MISSING_CMS=$(echo "$STACK_JSON" | jq -r --arg a "$APP" '
                .apps[] | select(.name==$a) |
                [(.config."env-from" // [])[], ((.config."volume-mounts" // [])[]?.configmap // empty)] |
                unique | .[]
              ')
              for C in $MISSING_CMS; do
                if ! kubectl get configmap "$C" -n "$NS" >/dev/null 2>&1; then
                  echo "ERROR: app $APP references ConfigMap '$C' which is missing in namespace $NS"
                  exit 1
                fi
              done
            fi

            # Build Deployment JSON with optional envFrom / volumes from stack secrets+config
            # Volume names are lowercased and sanitized for DNS-1123.
            DEPLOY_JSON=$(echo "$STACK_JSON" | jq -c --arg a "$APP" --arg ns "$NS" \
              --arg img "$IMAGE" --argjson cport "$CPORT" '
              def volname($prefix; $i; $n):
                (($prefix + "-" + ($i|tostring) + "-" + $n)
                 | ascii_downcase
                 | gsub("_"; "-")
                 | gsub("[^a-z0-9-]"; "-")
                 | gsub("-+"; "-")
                 | sub("^-+"; "")
                 | sub("-+$"; "")
                 | .[0:63]);
              (.apps[] | select(.name==$a)) as $app |
              ($app.secrets."env-from" // []) as $senv |
              ($app.config."env-from" // []) as $cenv |
              ($app.secrets."volume-mounts" // []) as $svm |
              ($app.config."volume-mounts" // []) as $cvm |
              [
                ($senv[] | {secretRef: {name: .}}),
                ($cenv[] | {configMapRef: {name: .}})
              ] as $envFrom |
              [
                ($svm | to_entries[] | {
                  name: volname("secret"; .key; .value.secret),
                  mountPath: .value."mount-path",
                  readOnly: true
                }),
                ($cvm | to_entries[] | {
                  name: volname("cm"; .key; .value.configmap),
                  mountPath: .value."mount-path",
                  readOnly: true
                })
              ] as $mounts |
              [
                ($svm | to_entries[] | {
                  name: volname("secret"; .key; .value.secret),
                  secret: {secretName: .value.secret}
                }),
                ($cvm | to_entries[] | {
                  name: volname("cm"; .key; .value.configmap),
                  configMap: {name: .value.configmap}
                })
              ] as $vols |
              ($app.downstream // []) as $down |
              (.propagation."header-name" // "x-dev-session") as $hname |
              (.propagation."baggage-key" // "dev-session") as $bkey |
              ((.propagation.enabled // true) | tostring) as $penabled |
              ($app."propagation-role" // (
                if ($down|length)==0 then "terminal"
                elif (($app.role // "")|ascii_downcase) == "frontend" then "originator"
                else "forwarder"
                end
              )) as $role |
              (
                if ($penabled == "false" or $penabled == "False") then []
                else
                  [
                    {name: "BAGGAGE_ENABLED", value: "true"},
                    {name: "BAGGAGE_ROLE", value: $role},
                    {name: "BAGGAGE_HEADER_NAME", value: $hname},
                    {name: "BAGGAGE_KEY", value: $bkey},
                    {name: "APP_NAME", value: $a}
                  ]
                  + (if ($down|length) > 0 then
                      [
                        {name: "DOWNSTREAM_URL", value: ("http://" + ($down[0]|tostring))},
                        {name: "BFF_UPSTREAM", value: ("http://" + ($down[0]|tostring))}
                      ]
                    else [] end)
                end
              ) as $baggageEnv |
              {
                apiVersion: "apps/v1",
                kind: "Deployment",
                metadata: {
                  name: $a,
                  namespace: $ns,
                  labels: {app: $a, "app.kubernetes.io/part-of": "tekton-stack"}
                },
                spec: {
                  replicas: 1,
                  selector: {matchLabels: {app: $a}},
                  template: {
                    metadata: {labels: {app: $a}},
                    spec: ({
                      containers: [(
                        {
                          name: "app",
                          image: $img,
                          ports: [{containerPort: ($cport|tonumber)}],
                          readinessProbe: {
                            tcpSocket: {port: ($cport|tonumber)},
                            initialDelaySeconds: 15,
                            periodSeconds: 10
                          }
                        }
                        + (if ($baggageEnv|length) > 0 then {env: $baggageEnv} else {} end)
                        + (if ($envFrom|length) > 0 then {envFrom: $envFrom} else {} end)
                        + (if ($mounts|length) > 0 then {volumeMounts: $mounts} else {} end)
                      )],
                    } + (if ($vols|length) > 0 then {volumes: $vols} else {} end))
                  }
                }
              }
            ')

            echo ""
            echo "  Deploying $APP -> $NS (image: $IMAGE)"
            echo "$DEPLOY_JSON" | jq -r '
              .spec.template.spec.containers[0].env // []
              | map("    " + .name + "=" + .value)
              | if length>0 then "  Baggage env:\n" + join("\n") else empty end
            '
            kubectl create namespace "$NS" --dry-run=client -o yaml | kubectl apply -f -
            echo "$DEPLOY_JSON" | kubectl apply -f -

            kubectl apply -f - <<EOF
          apiVersion: v1
          kind: Service
          metadata:
            name: ${APP}
            namespace: ${NS}
            labels:
              app: ${APP}
          spec:
            selector:
              app: ${APP}
            ports:
            - port: ${SPORT}
              targetPort: ${CPORT}
              name: http
          EOF
          done

          echo ""
          echo "  Waiting for Deployments to be available..."
          for APP in $(echo "$STACK_JSON" | jq -r '.apps[].name'); do
            IMAGE=$(echo "$BUILT" | jq -r --arg a "$APP" '.[$a]')
            [ -z "$IMAGE" ] || [ "$IMAGE" = "null" ] && continue
            NS=$(echo "$STACK_JSON" | jq -r --arg a "$APP" --arg d "$DEFAULT_NS" \
              '(.defaults.namespace // $d) as $dn | .apps[]|select(.name==$a)|.namespace // $dn')
            kubectl wait --for=condition=Available "deployment/${APP}" -n "$NS" --timeout=300s 2>/dev/null || echo "  WARN: $APP not ready yet"
          done
          echo "  Full stack deployed."
